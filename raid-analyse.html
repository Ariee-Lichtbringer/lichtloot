<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>LichtLoot Loganalyse</title>
  <style>
    :root{
      --bg:#080d14;--panel:#0d141f;--panel2:#111a27;--line:#263142;--soft:rgba(148,163,184,.12);
      --text:#f1f5f9;--muted:#94a3b8;--gold:#d8ad45;--blue:#60a5fa;--green:#34d399;
      --druid:#ff7c0a;--hunter:#aad372;--mage:#3fc7eb;--paladin:#f48cba;--priest:#f0ebe0;
      --rogue:#fff468;--shaman:#0070dd;--warlock:#8788ee;--warrior:#c69b6d;
    }
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;background:radial-gradient(circle at 78% -15%,rgba(44,62,84,.18),transparent 34%),linear-gradient(180deg,#080d14,#0a1019 60%,#080d14);color:var(--text);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    a{color:inherit}button,input,select{font:inherit}
    .shell{width:100%;max-width:none;margin:0;padding:28px clamp(18px,2.2vw,42px) 48px}
    .top{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:20px;align-items:start;margin-bottom:24px}
    .kicker{color:var(--gold);font-size:12px;font-weight:750;letter-spacing:.18em;text-transform:uppercase}
    h1{margin:10px 0 8px;font-size:38px;font-weight:650;line-height:1.08;letter-spacing:-.025em}
    .lead{margin:0;color:var(--muted);font-size:15px;font-weight:450;line-height:1.5}
    .actions,.tabs,.classbar,.filters{display:flex;gap:8px;flex-wrap:wrap}
    .btn,.tab,.class-btn{min-height:40px;border:1px solid var(--line);border-radius:6px;background:rgba(13,20,31,.92);color:var(--text);padding:8px 14px;font-weight:600;text-decoration:none;cursor:pointer}
    .btn.primary,.tab.active,.class-btn.active{border-color:rgba(216,173,69,.7);background:rgba(216,173,69,.10);color:#f1c968}
    .btn.ghost{background:rgba(13,22,36,.48)}
    .analysis-progress{margin:-10px 0 22px;padding:12px 14px;border:1px solid rgba(216,173,69,.38);border-radius:7px;background:rgba(216,173,69,.06)}
    .analysis-progress-head{display:flex;justify-content:space-between;gap:16px;margin-bottom:9px;color:#f1c968;font-size:12px;font-weight:650}.analysis-progress-head span:last-child{font-variant-numeric:tabular-nums}
    .analysis-progress-track{height:8px;overflow:hidden;border-radius:999px;background:#202b3a}.analysis-progress-fill{height:100%;width:4%;border-radius:inherit;background:linear-gradient(90deg,#c9972f,#facc15,#f5d67e);box-shadow:0 0 16px rgba(250,204,21,.34);transition:width .8s ease}
    .analysis-progress.running .analysis-progress-fill::after{content:"";display:block;width:35%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.52),transparent);animation:progressShimmer 1.2s linear infinite}
    @keyframes progressShimmer{from{transform:translateX(-110%)}to{transform:translateX(300%)}}
    .filters{padding:14px;border:1px solid var(--line);border-radius:7px;background:rgba(13,20,31,.78);margin-bottom:18px}
    input,select{min-height:42px;border:1px solid var(--line);border-radius:6px;background:#080d14;color:var(--text);padding:0 13px;font-weight:500}
    input{min-width:260px;flex:1}
    .grid{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:14px;align-items:start}
    .panel{border:1px solid var(--line);border-radius:8px;background:rgba(13,22,36,.84);box-shadow:0 18px 44px rgba(0,0,0,.28)}
    .panel-pad{padding:14px}
    .meta{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}
    .badge{display:inline-flex;align-items:center;min-height:25px;border:1px solid var(--line);border-radius:999px;padding:4px 8px;color:var(--muted);font-size:12px;font-weight:950}
    .badge.rpb{border-color:rgba(96,165,250,.42);color:#bfdbfe;background:rgba(96,165,250,.10)}
    .badge.cla{border-color:rgba(250,204,21,.42);color:#fde68a;background:rgba(250,204,21,.10)}
    .section-tools{display:grid;gap:10px;margin-bottom:10px}
    .tab[data-type="cla"]{border-color:rgba(250,204,21,.35)}
    .tab[data-type="rpb"]{border-color:rgba(96,165,250,.35)}
    .tab small{display:block;color:inherit;opacity:.7;font-size:11px;font-weight:950;margin-top:2px}
    .class-btn{min-height:34px;padding:6px 10px}
    .table-wrap{overflow:auto;border:1px solid var(--line);border-radius:8px;background:#060b13;max-height:72vh}
    table{border-collapse:separate;border-spacing:0;width:100%;min-width:920px}
    th,td{border-right:1px solid var(--soft);border-bottom:1px solid var(--soft);padding:7px 9px;white-space:pre-wrap;vertical-align:top;font-size:12px;font-weight:800}
    th{position:sticky;top:0;z-index:3;background:#111827;color:#f8fafc;text-align:left}
    th:first-child,td:first-child{position:sticky;left:0;z-index:2;background:#111827;min-width:220px}
    thead th:first-child{z-index:4}
    .list{display:grid;gap:11px}
    .analysis-row{display:grid;grid-template-columns:82px minmax(230px,1.3fr) minmax(210px,.9fr) minmax(260px,1fr) 80px;min-height:92px;overflow:hidden;border:1px solid var(--line);border-radius:7px;background:linear-gradient(100deg,rgba(17,26,39,.96),rgba(10,16,25,.98));transition:border-color .16s ease,transform .16s ease}
    .analysis-row:hover{border-color:rgba(216,173,69,.48);transform:translateY(-1px)}
    .raid-thumb{position:relative;min-height:92px;overflow:hidden;background:#080d14}
    .raid-thumb img{width:100%;height:100%;object-fit:cover;filter:saturate(.78) contrast(1.04);transition:transform .25s ease}
    .analysis-row:hover .raid-thumb img{transform:scale(1.025)}
    .raid-thumb::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent 62%,rgba(17,26,39,.96))}
    .report-main,.report-progress,.report-stats,.report-open{display:flex;flex-direction:column;justify-content:center;padding:13px 16px}
    .title{font-size:19px;font-weight:650;letter-spacing:-.015em}.sub{color:var(--muted);font-size:12px;font-weight:500;margin-top:8px}
    .roster-dots{display:flex;align-items:center;gap:5px;margin-top:9px;color:#cbd5e1;font-size:11px}.roster-dots i{width:8px;height:8px;border-radius:50%;background:var(--dot);box-shadow:0 0 0 1px rgba(255,255,255,.12)}
    .metric-label{color:#7f8b9c;font-size:10px;font-weight:650;letter-spacing:.08em;text-transform:uppercase}
    .progress-value{margin-top:8px;color:#e2e8f0;font-size:16px}.progress-value strong{color:#e4bb59;font-size:25px;font-weight:500}
    .progress-track{height:3px;margin-top:12px;overflow:hidden;background:#263142}.progress-fill{height:100%;background:#d8ad45}
    .progress-percent{margin-top:7px;color:#94a3b8;font-size:11px}
    .report-stats{display:grid;grid-template-columns:repeat(3,minmax(65px,1fr));gap:18px;border-left:1px solid var(--soft)}
    .report-stat strong{display:block;margin-top:8px;color:#e2e8f0;font-size:17px;font-weight:500}
    .report-open{align-items:flex-end}.details-link{color:#e4bb59;font-size:13px;font-weight:600;text-decoration:none}.details-link:hover{color:#f1d17e}
    .side{display:grid;gap:14px}
    .side h2{margin:0 0 10px;font-size:16px}
    .pills{display:flex;gap:6px;flex-wrap:wrap}
    .pill{display:inline-flex;align-items:center;min-height:25px;border:1px solid var(--line);border-radius:999px;padding:4px 8px;font-size:12px;font-weight:950;background:rgba(6,11,19,.82)}
    .status{padding:16px;border:1px solid var(--line);border-radius:8px;background:rgba(13,22,36,.82);color:var(--muted);font-weight:850}
    .overview{display:grid;grid-template-columns:repeat(5,minmax(120px,1fr));gap:10px;margin-bottom:14px}
    .overview-card{padding:13px;border:1px solid var(--line);border-radius:8px;background:linear-gradient(145deg,rgba(17,29,46,.96),rgba(9,17,29,.96))}
    .overview-card span{display:block;color:var(--muted);font-size:11px;font-weight:950;text-transform:uppercase;letter-spacing:.05em}
    .overview-card strong{display:block;margin-top:5px;font-size:21px;color:var(--text)}
    .detail-nav{display:flex;gap:28px;margin-bottom:14px;border:1px solid var(--line);border-radius:7px;background:rgba(13,20,31,.86);padding:0 18px}
    .detail-nav button{min-height:48px;border:0;border-bottom:2px solid transparent;background:transparent;color:#a8b3c4;padding:0 3px;font-weight:550;cursor:pointer}
    .detail-nav button.active{border-bottom-color:var(--gold);color:#e4bb59}
    .fight-filter{display:grid;gap:10px;margin-bottom:14px;padding:13px;border:1px solid var(--line);border-radius:7px;background:rgba(13,20,31,.9)}.fight-scope,.boss-chips{display:flex;gap:7px;flex-wrap:wrap}.fight-chip{display:inline-flex;align-items:center;gap:8px;min-height:38px;border:1px solid var(--line);border-radius:999px;background:#0a111b;color:#aeb8c7;padding:6px 11px;cursor:pointer}.fight-chip.active{border-color:#3b82f6;background:rgba(37,99,235,.14);color:#93c5fd}.fight-chip img{width:27px;height:27px;border-radius:50%;object-fit:cover;background:#111827}.fight-filter-label{color:#7f8b9c;font-size:10px;font-weight:750;letter-spacing:.1em;text-transform:uppercase}
    .dashboard-grid{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(300px,.85fr);gap:14px}
    .overview-controls{grid-column:1/-1;display:grid;gap:10px;padding:12px;border:1px solid var(--line);border-radius:7px;background:#0b121c}.overview-metrics{display:flex;gap:4px;overflow:auto;border-bottom:1px solid var(--soft)}.overview-metrics button{min-height:43px;border:0;border-bottom:2px solid transparent;background:transparent;color:#a8b3c4;padding:0 12px;white-space:nowrap;cursor:pointer}.overview-metrics button.active{border-bottom-color:#e4bb59;color:#f1f5f9}.overview-subfilters{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.overview-subfilters button,.overview-subfilters select{min-height:36px;border:1px solid var(--line);border-radius:5px;background:#0a111b;color:#cbd5e1;padding:6px 10px}.overview-subfilters button.active{border-color:#3b82f6;color:#93c5fd}.overview-table-name{display:flex;align-items:center;gap:8px}.overview-table-name img{width:23px;height:23px;border-radius:3px}.share-cell{min-width:360px;width:42%}.share-label{display:flex;justify-content:space-between;gap:10px}.share-bar{display:block;height:18px;margin-top:5px;background:#263142;border-radius:2px;overflow:hidden}.share-bar i{display:block;min-width:2px;height:100%;background:var(--bar-color,#d8ad45)}
    .dashboard-column{display:grid;gap:14px;align-content:start}
    .data-card{overflow:hidden;border:1px solid var(--line);border-radius:7px;background:rgba(13,20,31,.9)}
    .data-card h2{margin:0;padding:12px 14px;border-bottom:1px solid var(--soft);font-size:14px;font-weight:650}
    .encounter-row{display:grid;grid-template-columns:12px 34px minmax(150px,1fr) 105px 90px;gap:10px;align-items:center;padding:8px 14px;border-bottom:1px solid var(--soft);font-size:12px}
    .encounter-row:last-child{border-bottom:0}.kill-dot{width:11px;height:11px;border-radius:50%;background:#5fca7b;box-shadow:0 0 0 3px rgba(95,202,123,.1)}.kill-dot.wipe{background:#ef6b73}
    .encounter-boss-icon{width:30px;height:30px;border:1px solid #3a485b;border-radius:50%;background:#080d14;object-fit:cover}
    .encounter-name{display:flex;align-items:baseline;gap:7px;min-width:0}.encounter-name strong{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.encounter-best{color:#7f91a8;font-size:10px;font-weight:650;white-space:nowrap}.encounter-best.is-record{color:#f2c85f}
    .encounter-summary-count{margin-left:auto;margin-right:10px;padding:3px 8px;border:1px solid #2d3c50;border-radius:999px;color:#91a0b4;font-size:10px;font-weight:650}
    .encounter-card summary{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;cursor:pointer;font-size:14px;font-weight:700;list-style:none}.encounter-card summary::-webkit-details-marker{display:none}.encounter-card summary::after{content:'▾';color:#d8ad45}.encounter-card:not([open]) summary::after{content:'▸'}.encounter-card[open] summary{border-bottom:1px solid var(--soft)}
    .kill-time{color:#72d58c}.data-table{width:100%;min-width:760px}.data-table th,.data-table td{position:static!important;min-width:0!important;background:transparent;padding:9px 11px;font-weight:500;white-space:nowrap}.data-table th{color:#94a3b8;font-size:10px;font-weight:650;text-transform:uppercase}.player-name{font-weight:650}.role-tag{color:#cbd5e1}.metric-bar{display:inline-block;width:50px;height:4px;margin-left:7px;background:#273244;vertical-align:middle}.metric-bar i{display:block;height:100%;background:#d8ad45}
    .summary-list{display:grid}.summary-item{display:flex;justify-content:space-between;gap:14px;padding:8px 13px;border-bottom:1px solid var(--soft);color:#a8b3c4;font-size:12px}.summary-item:last-child{border-bottom:0}.summary-item strong{color:#e2e8f0;font-weight:550}
    .class-chart{display:grid;grid-template-columns:92px 1fr;gap:16px;align-items:center;padding:16px}.donut{display:grid;width:88px;height:88px;border-radius:50%;background:conic-gradient(#c69b6d 0 22%,#f48cba 22% 36%,#3fc7eb 36% 52%,#aad372 52% 68%,#8788ee 68% 84%,#fff468 84%);place-items:center}.donut::after{content:"";width:55px;height:55px;border-radius:50%;background:#0d141f}.donut-value{position:absolute;font-size:17px;font-weight:650}.class-legend{display:grid;grid-template-columns:1fr 1fr;gap:7px;font-size:11px;color:#b7c0ce}.class-legend span::before{content:"";display:inline-block;width:7px;height:7px;margin-right:6px;border-radius:2px;background:var(--class-color)}
    .notice-list{display:grid;gap:8px;padding:13px;color:#b8c2d0;font-size:12px}.notice{display:flex;gap:8px}.notice-mark{color:#e4bb59}.notice.bad .notice-mark{color:#ef6b73}
    .threat-details{display:grid;gap:8px;padding:14px}.threat-player-title{display:flex;justify-content:space-between;gap:14px;align-items:center;color:#d8ad45}.threat-ability-row{display:grid;grid-template-columns:minmax(180px,1fr) 110px minmax(240px,2fr) 72px;gap:12px;align-items:center;padding:9px 0;border-bottom:1px solid var(--soft)}.threat-ability-row:last-child{border-bottom:0}.threat-ability-bar{height:15px;border-radius:2px;background:#263142;overflow:hidden}.threat-ability-bar i{display:block;height:100%;background:linear-gradient(90deg,#c9972f,#facc15)}
    .analysis-data-view{margin-top:14px}
    .professional-view{display:grid;gap:14px}
    .analysis-filterbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:12px;border:1px solid var(--line);border-radius:7px;background:rgba(13,20,31,.9)}
    .analysis-filterbar button{display:inline-flex;align-items:center;gap:7px;min-height:36px;border:1px solid var(--line);border-radius:6px;background:#0a111b;color:#b8c2d0;padding:6px 10px;font-weight:550;cursor:pointer}.analysis-filterbar button.active{border-color:rgba(216,173,69,.68);color:#f1c968;background:rgba(216,173,69,.09)}
    .class-icon{width:23px;height:23px;border-radius:50%;object-fit:cover;background:#111827;box-shadow:0 0 0 1px rgba(255,255,255,.12)}
    .analysis-kpis{display:grid;grid-template-columns:repeat(4,minmax(130px,1fr));gap:10px}.analysis-kpi{padding:14px;border:1px solid var(--line);border-radius:7px;background:linear-gradient(145deg,rgba(17,26,39,.96),rgba(9,15,24,.96))}.analysis-kpi span{display:block;color:#7f8b9c;font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}.analysis-kpi strong{display:block;margin-top:7px;color:#e8edf4;font-size:22px;font-weight:580}
    .player-analysis-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:10px}
    .player-analysis-card{display:grid;grid-template-columns:48px minmax(0,1fr) 62px;gap:12px;align-items:start;padding:14px;border:1px solid var(--line);border-radius:7px;background:rgba(13,20,31,.92)}.player-analysis-card:hover{border-color:rgba(216,173,69,.42)}
    .player-class-icon{width:46px;height:46px;border-radius:50%;object-fit:cover;background:#080d14;box-shadow:0 0 0 2px var(--class-color,#334155)}.player-analysis-main{min-width:0}.player-analysis-name{font-size:15px;font-weight:650}.player-analysis-role{margin-top:3px;color:#94a3b8;font-size:11px}.player-analysis-metrics{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:12px}.player-analysis-metric{min-width:0}.player-analysis-metric span{display:block;overflow:hidden;color:#7f8b9c;font-size:9px;font-weight:700;text-overflow:ellipsis;text-transform:uppercase;white-space:nowrap}.player-analysis-metric strong{display:block;overflow:hidden;margin-top:3px;color:#dbe3ee;font-size:13px;font-weight:550;text-overflow:ellipsis;white-space:nowrap}
    .score-ring{display:grid;width:58px;height:58px;border-radius:50%;background:conic-gradient(var(--score-color,#d8ad45) calc(var(--score,0)*1%),#202b3a 0);place-items:center}.score-ring::before{content:"";grid-area:1/1;width:46px;height:46px;border-radius:50%;background:#0d141f}.score-ring strong{z-index:1;grid-area:1/1;color:#f1f5f9;font-size:13px}.score-caption{margin-top:5px;color:#7f8b9c;font-size:9px;text-align:center;text-transform:uppercase}
    .professional-empty{padding:28px;border:1px solid var(--line);border-radius:7px;color:#94a3b8;text-align:center}
    .module-shell{display:grid;grid-template-columns:250px minmax(0,1fr);gap:12px}.module-menu{display:grid;gap:6px;align-content:start;padding:10px;border:1px solid var(--line);border-radius:7px;background:#0d141f}.module-menu button{display:flex;justify-content:space-between;gap:8px;width:100%;border:1px solid transparent;border-radius:6px;background:transparent;color:#a8b3c4;padding:10px;text-align:left;cursor:pointer}.module-menu button.active{border-color:rgba(216,173,69,.55);background:rgba(216,173,69,.08);color:#f1c968}.module-content{display:grid;gap:12px}.module-heading{padding:15px;border:1px solid var(--line);border-radius:7px;background:linear-gradient(120deg,rgba(17,29,46,.98),rgba(10,16,25,.98))}.module-heading h2{margin:0;font-size:21px}.module-heading p{margin:6px 0 0;color:#94a3b8;font-size:12px}.metric-card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:9px}.metric-result-card{padding:13px;border:1px solid var(--line);border-radius:7px;background:#0d141f}.metric-result-card h3{margin:0 0 10px;color:#dbe3ee;font-size:13px}.metric-result-list{display:grid;gap:6px}.metric-result{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;color:#94a3b8;font-size:11px}.metric-result strong{color:#e2e8f0}.metric-result-bar{grid-column:1/-1;height:3px;background:#202b3a}.metric-result-bar i{display:block;height:100%;background:#d8ad45}.module-tag{color:#60a5fa;font-size:10px;font-weight:750;letter-spacing:.1em;text-transform:uppercase}.module-tag.cla{color:#facc15}

    Object.assign(BOSS_IMAGES,{"anub rekhan":"images/boss-icons/anub-rekhan.png",faerlina:"images/boss-icons/grand-widow-faerlina.png","grand widow faerlina":"images/boss-icons/grand-widow-faerlina.png",maexxna:"images/boss-icons/maexxna.png",noth:"images/boss-icons/noth-the-plaguebringer.png",heigan:"images/boss-icons/heigan-the-unclean.png",loatheb:"images/boss-icons/loatheb.png",razuvious:"images/boss-icons/instructor-razuvious.png",gothik:"images/boss-icons/gothik-the-harvester.png","four horsemen":"images/boss-icons/four-horsemen.png",patchwerk:"images/boss-icons/patchwerk.png",flickwerk:"images/boss-icons/patchwerk.png",grobbulus:"images/boss-icons/grobbulus.png",gluth:"images/boss-icons/gluth.png",thaddius:"images/boss-icons/thaddius.png",sapphiron:"images/boss-icons/sapphiron.png","kel thuzad":"images/boss-icons/kel-thuzad.png"});

    function html(value){return String(value ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
    function attr(value){return html(value);}
    function key(value){return String(value || "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]+/g," ").trim();}
    function startAnalysisProgress(){const box=document.getElementById("analysisProgress"),fill=document.getElementById("analysisProgressFill"),label=document.getElementById("analysisProgressText"),percent=document.getElementById("analysisProgressPercent");const phases=[[8,"Report wird von Warcraft Logs geladen …"],[24,"Bosskämpfe werden erkannt …"],[43,"Schaden und Heilung werden ausgewertet …"],[61,"Rollen und Aktivität werden berechnet …"],[76,"Worldbuffs und Verbrauchsgüter werden geprüft …"],[88,"Ausrüstung und Verzauberungen werden geladen …"],[94,"Auswertung wird gespeichert …"]];let value=3,phase=0;clearInterval(analysisProgressTimer);box.classList.remove("hidden");box.classList.add("running");fill.style.width=value+"%";percent.textContent=value+" %";label.textContent="Analyse wird vorbereitet …";analysisProgressTimer=setInterval(()=>{if(phase<phases.length&&value>=phases[phase][0]){label.textContent=phases[phase][1];phase++;}value=Math.min(94,value+(value<60?3:value<84?2:1));fill.style.width=value+"%";percent.textContent=value+" %";},900);}
    function finishAnalysisProgress(success=true){const box=document.getElementById("analysisProgress"),fill=document.getElementById("analysisProgressFill"),label=document.getElementById("analysisProgressText"),percent=document.getElementById("analysisProgressPercent");clearInterval(analysisProgressTimer);analysisProgressTimer=null;if(!box)return;if(success){box.classList.remove("running");fill.style.width="100%";percent.textContent="100 %";label.textContent="Analyse erfolgreich aktualisiert";setTimeout(()=>box.classList.add("hidden"),1400);}else{box.classList.remove("running");label.textContent="Aktualisierung fehlgeschlagen";percent.textContent="–";}}
    function dateDisplay(value){const m=String(value||"").match(/^(\d{4})-(\d{2})-(\d{2})/);return m?`${m[3]}.${m[2]}.${m[1]}`:(value||"-");}
    function raidName(entry){const text=key([entry?.raid,entry?.title,entry?.summary?.raid].join(" "));if(text.includes("blackwing")||text.includes("bwl"))return"BWL";if(text.includes("molten")||text.includes("mc"))return"MC";if(text.includes("aq40")||text.includes("ahn qiraj"))return"AQ40";if(text.includes("naxx"))return"NAXX";if(text.includes("ony"))return"ONY";if(text.includes("zg")||text.includes("zul gurub"))return"ZG";return entry?.raid||"Raid";}
    function raidDisplayName(value){return({MC:"Molten Core",BWL:"Blackwing Lair",AQ20:"Ruins of Ahn'Qiraj",AQ40:"Ahn'Qiraj 40",NAXX:"Naxxramas",ONY:"Onyxia",ZG:"Zul'Gurub"})[value]||value||"Raid";}
    function summaryNumber(summary,keys){for(const name of keys){const value=Number(summary?.[name]);if(Number.isFinite(value)&&value>=0)return value;}return null;}
    function durationDisplay(value){const ms=Number(value||0);if(!ms)return"–";const total=Math.round(ms>10000?ms/1000:ms);const h=Math.floor(total/3600);const m=Math.floor(total%3600/60);const s=total%60;return h?`${h}:${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`:`${m}:${String(s).padStart(2,"0")}`;}
    function shortNumber(value){const number=Number(value||0);if(number>=1000000)return(number/1000000).toFixed(1).replace(".0","")+"m";if(number>=1000)return Math.round(number/1000)+"k";return String(Math.round(number));}
    function roleLabel(player){if(player.signupRole)return player.signupRole;const mapped=({healer:"Heiler",tank:"Tank",main_tank:"Tank",off_tank:"Tank",caster:"DD",melee:"DD",hunter:"DD",cat:"DD",owl:"DD",shadow:"DD"})[player.raidRole];if(mapped)return mapped;return Number(player.healingDone||0)>1000&&Number(player.healingDone||0)>=Number(player.damageDone||0)*.5?"Heiler":"DD";}
    async function api(query){const url=API_URL+"?"+new URLSearchParams({...query,guild:params.get("guild")||"lichtloot",t:Date.now()});const res=await fetch(url,{cache:"no-store"});const data=await res.json().catch(()=>({}));if(!res.ok||data.success===false)throw new Error(data.error||"Daten konnten nicht geladen werden.");return data;}
    function sectionPlayers(section){
      const players=allPlayers();

    function cellText(value){return value&&typeof value==="object"?(value.text||value.name||value.itemName||""):value;}
    function matrixValues(section){
      const stored=section?.matrix?.values || section?.payload?.values;
      if(Array.isArray(stored))return stored;
      if(!Array.isArray(section?.rows))return[];
      const players=sectionPlayers(section);
      return [["Kennzahl",...players.map(player=>player.name)],...section.rows.map(row=>[row.label||"",...players.map(player=>cellText(row.values?.[player.name]??""))])];
    }
    function matrixBackgrounds(section){return section?.matrix?.backgrounds || section?.payload?.backgrounds || [];}
    function matrixFontColors(section){return section?.matrix?.fontColors || section?.payload?.fontColors || [];}
    function clusterFor(label,type){
      if(type==="cla") return "all";
      const t=key(label);
      if(t.includes("heiler")||t.includes("heal")) return t.includes("cast")||t.includes("zauber") ? "healerCast" : "healer";
      if(t.includes("physical")||t.includes("physisch")||t.includes("nahkampf")||t.includes("melee")) return t.includes("cast")||t.includes("zauber") ? "physicalCast" : "physical";
      if(t.includes("caster")||t.includes("zauberer")||t.includes("spell")) return t.includes("cast")||t.includes("zauber") ? "casterCast" : "caster";
      if(t.includes("tank")) return t.includes("cast")||t.includes("zauber") ? "tankCast" : "tank";
      return "all";
    }
    function sectionLabel(section){
      if(section.type==="cla") return section.label || "CLA";

      const map = {healer:"Heiler",healerCast:"Heiler Cast",caster:"Caster",casterCast:"Caster Cast",physical:"Physical",physicalCast:"Physical Cast",tank:"Tank",tankCast:"Tank Cast",all:"RBP"};

      const players=rawAllPlayers();

      try{
        const response=await api({action:"getPublicLogAnalysisPlayerProfile",playerName:name});const profile=response.profile||{};const latest=profile.latest||{};const healer=profile.signupRole==="Heiler"||profile.raidRole==="healer";const metric=healer?"hps":"dps";const history=Array.isArray(profile.history)?profile.history:[];const gear=Array.isArray(latest.gear)?latest.gear:[];
        modal.innerHTML=`<div class="player-modal-box"><div class="player-modal-head"><div class="player-modal-title"><img src="${attr(CLASS_ICON[profile.className]||CLASS_ICON.Unknown)}" alt=""><div><h2 style="color:${CLASS_COLOR[profile.className]||'#e2e8f0'}">${html(profile.name)}</h2><p>${html(profile.server||"Server nicht hinterlegt")} · ${html(profile.signupRole||roleLabel(profile))} · ${html(CLASS_LABEL[profile.className]||profile.className||"Unbekannt")}</p></div></div><button class="modal-close" type="button" onclick="closePlayerProfile()">Schließen</button></div><div class="player-modal-body"><div class="profile-actions">${latest.reportUrl?`<a class="btn ghost" target="_blank" rel="noopener" href="${attr(latest.reportUrl)}">Warcraft Logs ↗</a>`:""}<button class="gear-button" type="button" onclick="document.getElementById('profileGear').scrollIntoView({behavior:'smooth'})">Ausrüstung dieses Raids (${gear.length})</button></div><div class="profile-top-percent"><span>Gildenleistung im letzten Raid</span><strong>Top ${Number(profile.topPercent||100)} %</strong><div class="sub">Einordnung innerhalb derselben Rolle</div></div><div class="player-profile-kpis">${[["Raids",profile.raidCount],["Aktuell",`${shortNumber(latest[metric]||0)} ${metric.toUpperCase()}`],["Bestwert",`${shortNumber(healer?profile.bestHps:profile.bestDps)} ${metric.toUpperCase()}`],["Aktivität",`${latest.activityPercent||0} %`]].map(([label,value])=>`<div class="analysis-kpi"><span>${html(label)}</span><strong>${html(value)}</strong></div>`).join("")}</div><section class="player-profile-chart"><h3>Dienstakte · ${metric.toUpperCase()}</h3>${profileChartSvg(history,metric)}</section><section class="data-card"><h2>Raid-Historie</h2><div class="profile-history" style="padding:12px">${history.slice().reverse().map(entry=>`<div class="profile-history-row"><span>${html(dateDisplay(entry.raidDate))}</span><strong>${html(entry.raid)}</strong><span>${shortNumber(entry.dps)} DPS</span><span>${shortNumber(entry.hps)} HPS</span><span>${entry.activityPercent}% aktiv</span><span>${entry.deaths} Tode</span><span>${entry.worldBuffCount} Buffs</span></div>`).join("")}</div></section><section id="profileGear" class="data-card"><h2>Im Raid getragene Ausrüstung · ${html(latest.raid||"")}</h2><div class="gear-grid" style="padding:12px">${gear.length?gear.map(item=>`<a class="gear-item" ${item.wowhead?`href="${attr(item.wowhead)}" target="_blank" rel="noopener"`:""} title="${attr(item.tooltip||item.text||"")}"><img src="${attr(itemIconUrl(item))}" alt=""><div><span>${html(item.slot||"Ausrüstung")}${item.itemLevel?` · Itemlevel ${html(item.itemLevel)}`:""}</span><strong>${html(item.text||item.itemId||"Unbekanntes Item")}</strong><small>${item.enchant?`Enchant: ${html(item.enchant)}`:"Kein Enchant erkannt"}</small></div></a>`).join(""):'<div class="professional-empty">Für diese gespeicherte Analyse sind noch keine Ausrüstungsdaten vorhanden. Bitte die Analyse einmal aktualisieren.</div>'}</div></section></div></div>`;
      }catch(error){modal.querySelector(".player-modal-box").innerHTML=`<div class="player-modal-head"><strong>Spielerprofil</strong><button class="modal-close" type="button" onclick="closePlayerProfile()">Schließen</button></div><div class="player-modal-body"><div class="status error">${html(error.message||"Profil konnte nicht geladen werden.")}</div></div>`;}
    }
    function closePlayerProfile(){document.getElementById("playerProfileModal")?.remove();}
    let myRaidProfiles=[];let myRaidCharacterIndex=0;let myRaidHistoryIndex=0;
    function playerLoginPin(){const guild=String(params.get("guild")||"lichtloot").trim().toLowerCase();const storageKey=`lichtlootPlayerPin_${guild}`;try{return localStorage.getItem(storageKey)||sessionStorage.getItem(storageKey)||"";}catch(error){return"";}}
    async function openMyRaidPerformance(){closeMyRaidPerformance();const modal=document.createElement("div");modal.id="myRaidPerformanceModal";modal.className="player-modal";modal.onclick=event=>{if(event.target===modal)closeMyRaidPerformance();};modal.innerHTML='<div class="player-modal-box myraid-modal-box"><div class="player-modal-head"><strong>Meine Raidleistung wird geladen …</strong><button class="modal-close" type="button" onclick="closeMyRaidPerformance()">Schließen</button></div></div>';document.body.appendChild(modal);const pin=playerLoginPin();if(!pin){const guild=encodeURIComponent(params.get("guild")||"lichtloot");modal.querySelector(".player-modal-box").innerHTML=`<div class="player-modal-head"><strong>Meine Raidleistung</strong><button class="modal-close" type="button" onclick="closeMyRaidPerformance()">Schließen</button></div><div class="player-modal-body"><div class="myraid-empty"><h3>Noch nicht mit einem SpielerLogin verbunden</h3><p>Melde dich einmal mit deinem NachtLoot-/LichtLoot-SpielerLogin an. Danach erkennt diese Seite deine freigegebenen Charaktere automatisch.</p><a class="btn primary myraid-login-link" href="index.html?guild=${guild}">Zum SpielerLogin</a></div></div>`;return;}try{const characterResponse=await api({action:"getCharactersByPin",pin});const characters=characterResponse.characters||characterResponse.entries||characterResponse.chars||[];if(!characters.length)throw new Error("Für diesen SpielerLogin wurden keine freigegebenen Charaktere gefunden.");const results=await Promise.allSettled(characters.map(character=>api({action:"getPublicLogAnalysisPlayerProfile",playerName:character.name||character.char||character.player})));myRaidProfiles=results.map((result,index)=>result.status==="fulfilled"?{character:characters[index],profile:result.value.profile}:null).filter(Boolean);if(!myRaidProfiles.length)throw new Error("Für deine Charaktere wurden noch keine Raidanalysen gespeichert.");myRaidCharacterIndex=0;myRaidHistoryIndex=Math.max(0,(myRaidProfiles[0].profile.history||[]).length-1);renderMyRaidPerformance();}catch(error){modal.querySelector(".player-modal-box").innerHTML=`<div class="player-modal-head"><strong>Meine Raidleistung</strong><button class="modal-close" type="button" onclick="closeMyRaidPerformance()">Schließen</button></div><div class="player-modal-body"><div class="status error">${html(error.message||"Deine Daten konnten nicht geladen werden.")}</div></div>`;}}
    function selectMyRaidCharacter(index){myRaidCharacterIndex=Math.max(0,Math.min(myRaidProfiles.length-1,Number(index)||0));const history=myRaidProfiles[myRaidCharacterIndex]?.profile?.history||[];myRaidHistoryIndex=Math.max(0,history.length-1);renderMyRaidPerformance();}
    function selectMyRaidHistory(index){myRaidHistoryIndex=Math.max(0,Number(index)||0);renderMyRaidPerformance();}
    function renderMyRaidPerformance(){const modal=document.getElementById("myRaidPerformanceModal");const selected=myRaidProfiles[myRaidCharacterIndex];if(!modal||!selected)return;const profile=selected.profile||{};const history=Array.isArray(profile.history)?profile.history:[];const raid=history[myRaidHistoryIndex]||history[history.length-1]||{};const className=profile.className||selected.character.class_name||selected.character.className||"Unknown";const role=raid.signupRole||raid.raidRole||profile.signupRole||profile.raidRole||"Nicht zugeordnet";const chars=myRaidProfiles.map((entry,index)=>{const cls=entry.profile?.className||entry.character?.class_name||entry.character?.className||"Unknown";return `<button class="myraid-character ${index===myRaidCharacterIndex?'active':''}" type="button" onclick="selectMyRaidCharacter(${index})"><img src="${attr(CLASS_ICON[cls]||CLASS_ICON.Unknown)}" alt=""><span style="color:${CLASS_COLOR[cls]||'#e2e8f0'}">${html(entry.profile?.name||entry.character?.name||'Charakter')}</span></button>`}).join("");const raids=history.map((entry,index)=>`<button class="myraid-raid ${index===myRaidHistoryIndex?'active':''}" type="button" onclick="selectMyRaidHistory(${index})"><strong>${html(entry.raid||'Raid')}</strong><span>${html(dateDisplay(entry.raidDate))}</span><small>${shortNumber(entry.dps)} DPS · ${shortNumber(entry.hps)} HPS</small></button>`).reverse().join("");const trend=history.length>1?profileChartSvg(history,(role==="Heiler"||role==="healer")?"hps":"dps"):"";modal.querySelector(".player-modal-box").innerHTML=`<div class="player-modal-head"><div><strong>Meine Raidleistung</strong><div class="sub">Verbunden mit deinem SpielerLogin · ${history.length} Teilnahmen für ${html(profile.name||'Charakter')}</div></div><button class="modal-close" type="button" onclick="closeMyRaidPerformance()">Schließen</button></div><div class="player-modal-body"><div class="myraid-character-tabs">${chars}</div><div class="myraid-layout"><aside class="myraid-sidebar">${raids}</aside><main class="myraid-content"><section class="myraid-hero"><h3>${html(raid.raid||'Raid')} · ${html(dateDisplay(raid.raidDate))}</h3><p><span style="color:${CLASS_COLOR[className]||'#e2e8f0'}">${html(profile.name)}</span> · ${html(CLASS_LABEL[className]||className)} · ${html(role)}</p></section><div class="myraid-stats"><article class="myraid-stat damage"><span>DPS</span><strong>${shortNumber(raid.dps||0)}</strong></article><article class="myraid-stat heal"><span>HPS</span><strong>${shortNumber(raid.hps||0)}</strong></article><article class="myraid-stat rpb"><span>RPB · Aktivität</span><strong>${Math.round(Number(raid.activityPercent||0))} %</strong></article><article class="myraid-stat buff"><span>Worldbuffs</span><strong>${Number(raid.worldBuffCount||0)}</strong></article><article class="myraid-stat"><span>Schaden</span><strong>${shortNumber(raid.damageDone||0)}</strong></article><article class="myraid-stat"><span>Heilung</span><strong>${shortNumber(raid.healingDone||0)}</strong></article><article class="myraid-stat"><span>Vorbereitung</span><strong>${Number(raid.preparationCount||0)}</strong></article><article class="myraid-stat"><span>Tode</span><strong>${Number(raid.deaths||0)}</strong></article></div>${raid.analysisId?`<div class="profile-actions"><a class="btn primary" href="raid-analyse.html?id=${encodeURIComponent(raid.analysisId)}&guild=${encodeURIComponent(params.get('guild')||'lichtloot')}">Diesen Raid öffnen</a>${raid.reportUrl?`<a class="btn ghost" href="${attr(raid.reportUrl)}" target="_blank" rel="noopener">Warcraft Logs ↗</a>`:''}</div>`:''}${trend?`<section class="player-profile-chart"><h3>Persönliche Entwicklung</h3>${trend}</section>`:''}<section class="data-card"><h2>Alle Teilnahmen</h2><div class="myraid-history-table"><table><thead><tr><th>Datum</th><th>Raid</th><th>Rolle</th><th>DPS</th><th>HPS</th><th>Aktivität</th><th>Worldbuffs</th><th>Tode</th></tr></thead><tbody>${history.slice().reverse().map((entry,index)=>`<tr><td>${html(dateDisplay(entry.raidDate))}</td><td>${html(entry.raid)}</td><td>${html(entry.signupRole||entry.raidRole||'–')}</td><td>${shortNumber(entry.dps)}</td><td>${shortNumber(entry.hps)}</td><td>${Math.round(Number(entry.activityPercent||0))} %</td><td>${Number(entry.worldBuffCount||0)}</td><td>${Number(entry.deaths||0)}</td></tr>`).join("")}</tbody></table></div></section></main></div></div>`;}
    function closeMyRaidPerformance(){document.getElementById("myRaidPerformanceModal")?.remove();myRaidProfiles=[];}
    document.addEventListener("keydown",event=>{if(event.key==="Escape"){closePlayerProfile();closeMyRaidPerformance();}});
    function renderSectionTabs(){
      document.getElementById("sectionTabs").innerHTML=state.sections.map(section=>`
        <button class="tab ${section.id===state.activeSection?'active':''}" data-type="${attr(section.type)}" type="button" onclick="selectSection('${attr(section.id)}')">
          ${html(sectionLabel(section))}<small>${html(section.type.toUpperCase())}${section.label&&sectionLabel(section)!==section.label?" · "+html(section.label):""}</small>
        </button>`).join("") || '<div class="status">Keine Analysedaten vorhanden.</div>';
    }
    function renderClassTabs(){
      const section=activeSection();
      const classes=classesForSection(section);
      document.getElementById("classTabs").innerHTML='<button class="class-btn '+(!state.activeClass?'active':'')+'" type="button" onclick="selectClass(\'\')">Alle</button>'+
        classes.map(cls=>`<button class="class-btn ${state.activeClass===cls?'active':''}" style="color:${CLASS_COLOR[cls]||'#cbd5e1'}" type="button" onclick="selectClass('${attr(cls)}')">${html(CLASS_LABEL[cls]||cls)}</button>`).join("");
    }
    function activeSection(){return state.sections.find(s=>s.id===state.activeSection)||state.sections[0]||null;}
    function rowMatchesClass(row, classes){
      if(!state.activeClass) return true;
      const rowText=key(row.join(" "));
      const classLabel=key(CLASS_LABEL[state.activeClass]||state.activeClass);
      return rowText.includes(key(state.activeClass)) || rowText.includes(classLabel);
    }
    function renderTable(){
      const section=activeSection();
      const table=document.getElementById("sheetTable");
      if(!section){table.innerHTML='<tbody><tr><td>Keine Analysedaten vorhanden.</td></tr></tbody>';return;}
      const values=matrixValues(section);
      const bgs=matrixBackgrounds(section);
      const fcs=matrixFontColors(section);
      const q=key(document.getElementById("search").value);
      const classes=classesForSection(section);
      const rows=values.map((row,rowIndex)=>({row:Array.isArray(row)?row:[],rowIndex}))
        .filter(item=>item.row.some(cell=>String(cell||"").trim()))
        .filter(item=>(!q||key(item.row.join(" ")).includes(q)) && rowMatchesClass(item.row, classes));
      const used=new Set();
      rows.forEach(({row})=>row.forEach((cell,index)=>{if(String(cell||"").trim())used.add(index);}));
      const cols=[...used].sort((a,b)=>a-b);
      const body=rows.map(({row,rowIndex})=>`<tr>${cols.map(col=>{
        const style=[];
        const bg=bgs[rowIndex]?.[col]; const color=fcs[rowIndex]?.[col];
        if(bg) style.push(`background:${String(bg).replace(/"/g,"")}`);
        if(color) style.push(`color:${String(color).replace(/"/g,"")}`);
        return `<td style="${attr(style.join(";"))}">${html(row[col]||"")}</td>`;
      }).join("")}</tr>`).join("");
      table.innerHTML=`<thead><tr>${cols.map((_,i)=>`<th>${i===0?html(section.label||sectionLabel(section)):""}</th>`).join("")}</tr></thead><tbody>${body||'<tr><td>Keine Treffer.</td></tr>'}</tbody>`;
    }
    function renderSide(){
      const section=activeSection();
      const classes=classesForSection(section);
      document.getElementById("sectionInfo").innerHTML=section?`${html(section.type.toUpperCase())} · ${html(section.label||sectionLabel(section))}`:"-";
      document.getElementById("classInfo").innerHTML=classes.map(cls=>`<span class="pill" style="color:${CLASS_COLOR[cls]||'#cbd5e1'}">${html(CLASS_LABEL[cls]||cls)}</span>`).join("")||'<span class="sub">Keine Klassen erkannt.</span>';
      const warnings=[...(state.detail?.rpb?.warnings||[]),...(state.detail?.cla?.warnings||[])];
      document.getElementById("warnings").innerHTML=warnings.length?warnings.map(html).join("<br>"):"Keine Hinweise.";
    }
    function selectSection(id){state.activeSection=id;state.activeClass="";renderDetail();}
    function selectClass(cls){state.activeClass=cls||"";renderClassTabs();renderTable();}
    function resetFilters(){document.getElementById("search").value="";document.getElementById("raidFilter").value="";state.activeClass="";renderCurrent();}
    function renderCurrent(){state.mode==="detail"?renderDetail():renderList();}
    function reload(){const button=document.getElementById("reloadButton");if(button)button.disabled=true;state.mode==="detail"?loadDetail(true).catch(error=>{if(button){button.disabled=false;button.textContent="Analyse aktualisieren";}showError(error);}):loadList().then(()=>{if(button)button.disabled=false;}).catch(error=>{if(button)button.disabled=false;showError(error);});}
    function showError(error){const box=state.mode==="detail"?document.getElementById("professionalView"):document.getElementById("listView");if(box)box.innerHTML=`<div class="status error">${html(error.message||"Fehler")}</div>`;}
    (async()=>{try{state.mode==="detail"?await loadDetail():await loadList();}catch(error){showError(error);}})();
  </script>
</body>
</html>
