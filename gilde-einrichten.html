<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="/scroll-performance.css">
  <title>LichtLoot - Gilde einrichten</title>
  <style>
    :root{--gold:#facc15;--blue:#60a5fa;--panel:rgba(15,23,42,.88);--line:rgba(250,204,21,.24);--text:#e5edf8;--muted:#aebbd0}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#020617 url("images/app-background.svg") center/cover fixed;color:var(--text)}
    body:before{content:"";position:fixed;inset:0;background:rgba(2,6,23,.72);backdrop-filter:blur(2px)}
    main{position:relative;z-index:1;width:min(980px,calc(100vw - 32px));margin:0 auto;padding:42px 0}
    .brand{display:flex;align-items:center;gap:16px;margin-bottom:24px}
    .brand img{width:92px;height:auto}
    h1{margin:0;color:var(--gold);font-size:clamp(34px,5vw,58px);line-height:.95}
    p{color:var(--muted);font-weight:800}
    .panel{border:1px solid var(--line);border-radius:10px;background:var(--panel);box-shadow:0 24px 80px rgba(0,0,0,.35);padding:24px}
    .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
    label{display:grid;gap:7px;color:var(--gold);font-size:13px;font-weight:950;text-transform:uppercase;letter-spacing:.02em}
    input,select{width:100%;border:1px solid rgba(148,163,184,.28);border-radius:8px;background:rgba(2,6,23,.78);color:var(--text);padding:14px 15px;font:inherit;font-weight:850;outline:none}
    input:focus,select:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(96,165,250,.18)}
    .full{grid-column:1/-1}
    .actions{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:18px}
    button,.linkbtn{border:1px solid rgba(250,204,21,.32);border-radius:8px;background:linear-gradient(135deg,rgba(250,204,21,.30),rgba(29,78,216,.20));color:#f8fafc;padding:13px 18px;font-weight:950;text-decoration:none;cursor:pointer}
    button:hover,.linkbtn:hover{border-color:rgba(96,165,250,.65)}
    .status{margin-top:16px;border:1px solid rgba(148,163,184,.25);border-radius:8px;padding:13px 14px;font-weight:850;color:var(--muted)}
    .status.good{border-color:rgba(34,197,94,.45);color:#86efac;background:rgba(22,101,52,.16)}
    .status.bad{border-color:rgba(248,113,113,.45);color:#fecaca;background:rgba(127,29,29,.18)}
    .preview{display:grid;gap:10px;margin-top:18px;padding:16px;border:1px solid rgba(96,165,250,.24);border-radius:10px;background:rgba(2,6,23,.42)}
    .readiness{display:grid;gap:9px;padding:14px;border:1px solid rgba(148,163,184,.22);border-radius:9px;background:rgba(15,23,42,.72)}
    .readiness strong{color:#f8fafc}
    .check{display:flex;align-items:center;gap:9px;color:#fecaca;font-weight:850}
    .check.done{color:#86efac}
    .check i{display:grid;place-items:center;width:22px;height:22px;border-radius:50%;background:rgba(248,113,113,.14);font-style:normal}
    .check.done i{background:rgba(34,197,94,.16)}
    fieldset{grid-column:1/-1;margin:4px 0 0;padding:18px;border:1px solid rgba(96,165,250,.25);border-radius:10px;background:rgba(2,6,23,.28)}
    legend{padding:0 8px;color:var(--gold);font-weight:950;text-transform:uppercase}
    .choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:9px}
    label.choice{display:flex;align-items:center;gap:9px;padding:10px;border:1px solid rgba(148,163,184,.22);border-radius:8px;color:var(--text);text-transform:none}
    label.choice input[type="checkbox"]{width:18px;height:18px;flex:0 0 auto}
    @media(max-width:720px){.grid{grid-template-columns:1fr}.brand{align-items:flex-start;flex-direction:column}}
  </style>
</head>
<body>
<main>
  <div class="brand">
    <img src="images/content.png" alt="LichtLoot">
    <div>
      <h1>Gilde einrichten</h1>
      <p>Logo, Farben und GildenPIN festlegen. Danach ist die Gilde als eigener Bereich erreichbar.</p>
    </div>
  </div>

  <form class="panel" id="guildSetupForm">
    <input type="hidden" name="fullEraSetup" value="true">
    <div class="grid">
      <label>Gildenname
        <input name="guildName" required>
      </label>
      <label>Lootsystem-Name
        <input name="lootName" required>
      </label>
      <label>Server
        <input name="server">
      </label>
      <label>Leitungscode
        <input name="guildPin" type="password" minlength="6" maxlength="32" required autocomplete="new-password" placeholder="Mindestens 6 Zeichen">
      </label>
      <label>Discord-Server-ID
        <input name="discordGuildId" inputmode="numeric" pattern="[0-9]{15,22}" placeholder="Rechtsklick auf den Discord-Server → ID kopieren">
      </label>
      <label>Warcraft-Logs-Gilden-ID
        <input name="warcraftLogsGuildId" inputmode="numeric" pattern="[0-9]*" placeholder="Zahl aus der Warcraft-Logs-Gildenadresse">
      </label>
      <label>Era-Grundprofil
        <select name="setupProfile">
          <option value="standard">Classic Standard – P1, P2 und P3</option>
          <option value="casual">Casual – P1 und P2</option>
          <option value="progress">Progress – mit Rekruten und Attendance</option>
        </select>
      </label>
      <label>Logo-URL
        <input name="logoUrl" placeholder="https://...">
      </label>
      <label>Hintergrund-URL
        <input name="backgroundUrl" placeholder="https://...">
      </label>
      <label>Hauptfarbe
        <input name="primaryColor" type="color" value="#facc15">
      </label>
      <label>Akzentfarbe
        <input name="accentColor" type="color" value="#1d4ed8">
      </label>
      <fieldset><legend>Unterstützte Raids</legend><div class="choices">
        <label class="choice"><input type="checkbox" name="raid_mc" checked> Molten Core</label><label class="choice"><input type="checkbox" name="raid_bwl" checked> Blackwing Lair</label><label class="choice"><input type="checkbox" name="raid_ony" checked> Onyxia</label><label class="choice"><input type="checkbox" name="raid_zg" checked> Zul'Gurub</label><label class="choice"><input type="checkbox" name="raid_aq20" checked> Ahn'Qiraj 20</label><label class="choice"><input type="checkbox" name="raid_aq40" checked> Ahn'Qiraj 40</label><label class="choice"><input type="checkbox" name="raid_naxx" checked> Naxxramas</label>
      </div></fieldset>
      <fieldset><legend>Prioritätsstufen</legend><div class="grid">
        <label><span><input type="checkbox" name="priority_p1_enabled" checked style="width:auto"> Stufe aktiv</span><input name="priority_p1_label" value="P1" maxlength="20"></label>
        <label><span><input type="checkbox" name="priority_p2_enabled" checked style="width:auto"> Stufe aktiv</span><input name="priority_p2_label" value="P2" maxlength="20"></label>
        <label><span><input type="checkbox" name="priority_p3_enabled" checked style="width:auto"> Stufe aktiv</span><input name="priority_p3_label" value="P3" maxlength="20"></label>
      </div></fieldset>
      <fieldset><legend>Rekruten und Freigaben</legend><div class="choices"><label class="choice"><input type="checkbox" name="recruitEnabled"> Rekrutenregeln aktivieren</label><label class="choice"><input type="checkbox" name="recruitCountBench" checked> Bench als Teilnahme zählen</label><label class="choice"><input type="checkbox" name="poReleaseApplications"> Freigabeanträge aktivieren</label></div><p>Betroffene Rekruten-Raids</p><div class="choices"><label class="choice"><input type="checkbox" name="recruit_raid_bwl" checked> BWL</label><label class="choice"><input type="checkbox" name="recruit_raid_aq40" checked> AQ40</label><label class="choice"><input type="checkbox" name="recruit_raid_naxx" checked> Naxx</label></div><p>Für Rekruten erlaubte Prios</p><div class="choices"><label class="choice"><input type="checkbox" name="recruit_priority_p1"> P1</label><label class="choice"><input type="checkbox" name="recruit_priority_p2" checked> P2</label><label class="choice"><input type="checkbox" name="recruit_priority_p3" checked> P3</label><label class="choice"><input type="checkbox" name="recruit_priority_p0plus"> P0+</label></div><div class="grid" style="margin-top:12px"><label>Mindestteilnahmen<input name="recruitMinAttendance" type="number" min="0" max="50" value="3"></label><label>Attendance-Zeitraum<input name="attendanceWindow" type="number" min="1" max="50" value="16"></label><label>Warnschwelle<input name="lowAttendanceWarning" type="number" min="0" max="50" value="6"></label></div></fieldset>
      <fieldset><legend>P0+-Punkte</legend><div class="grid"><label>Punkte je Raidübertragung<input name="raidTransferPoints" type="number" min="0" max="100" step="0.5" value="1"></label><label>Bench-Punkte<input name="benchPoints" type="number" min="0" max="100" step="0.5" value="0.5"></label></div></fieldset>
    </div>
    <div class="actions">
      <button type="submit">Gilde einrichten</button>
      <a class="linkbtn" href="gilde-anmelden.html">Zur Anmeldung</a>
    </div>
    <div id="status" class="status">Freischaltlink wird geprüft ...</div>
    <div id="resultLinks" class="preview" hidden></div>
  </form>
</main>
<script>
const API_URL = "https://lichtloot-production.up.railway.app/api/apps-script";
const token = new URLSearchParams(location.search).get("token") || "";
const form = document.getElementById("guildSetupForm");
const statusBox = document.getElementById("status");
const resultLinks = document.getElementById("resultLinks");
function setStatus(text, type){ statusBox.textContent = text; statusBox.className = "status " + (type || ""); }
function setValue(name, value){ const input = form.elements[name]; if(input && value) input.value = value; }
function normalizeGuildSlug(value){
  return String(value || "")
    .trim()
    .toLowerCase()
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g,"")
    .replace(/ä/g,"ae")
    .replace(/ö/g,"oe")
    .replace(/ü/g,"ue")
    .replace(/ß/g,"ss")
    .replace(/[^a-z0-9]+/g,"-")
    .replace(/^-+|-+$/g,"");
}
function slugFromUrl(value){
  try{
    const url = new URL(value, location.href);
    return normalizeGuildSlug(url.searchParams.get("guild") || url.searchParams.get("gilde"));
  }catch(error){
    return "";
  }
}
function buildGuildUrl(page, slug){
  const url = new URL(page, location.origin + location.pathname.replace(/[^/]*$/, ""));
  if(slug) url.searchParams.set("guild", slug);
  return url.toString();
}
function safeHtml(value){
  return String(value == null ? "" : value).replace(/[&<>"']/g, char => ({
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    '"':"&quot;",
    "'":"&#39;"
  }[char]));
}
function discordInviteUrl(clientId,permissions,discordGuildId){
  const params=new URLSearchParams({client_id:clientId,permissions,scope:"bot applications.commands"});
  const guildId=String(discordGuildId||"").replace(/\D/g,"");
  if(guildId){params.set("guild_id",guildId);params.set("disable_guild_select","true");}
  return "https://discord.com/oauth2/authorize?"+params.toString();
}
function renderResultLinks(result){
  const guild = result.guild || {};
  const app = result.application || {};
  const slug = normalizeGuildSlug(result.guildSlug || guild.slug || app.guildSlug) || slugFromUrl(result.startUrl) || slugFromUrl(result.leadershipUrl);
  const startUrl = result.startUrl || buildGuildUrl("start.html", slug);
  const leadershipUrl = result.leadershipUrl || buildGuildUrl("gildenleitung.html", slug);
  const guildName = guild.name || app.guildName || form.elements.guildName?.value || "Neue Gilde";
  const guildPin = result.guildPin || guild.guildPin || app.guildPin || app.desiredGuildPin || form.elements.guildPin?.value || "";
  const ready=Boolean(result.readiness?.ready);
  const discordGuildId=app.discordGuildId||form.elements.discordGuildId?.value||"";
  resultLinks.innerHTML = `
    <strong>${safeHtml(guildName)}</strong>
    ${slug ? `<span>Bereich: ${safeHtml(slug)}</span>` : ""}
    ${guildPin ? `<span>GildenPIN: ${safeHtml(guildPin)}</span>` : ""}
    ${renderReadiness(result.readiness)}
    ${ready?`<a class="linkbtn" href="${safeHtml(startUrl)}">Startseite öffnen</a><a class="linkbtn" href="${safeHtml(leadershipUrl)}">Gildenleitung öffnen</a>`:`<div class="readiness"><strong>Discord-Bots verbinden</strong><span>Beide Bots einladen, anschließend etwas warten und die Bereitschaft erneut prüfen.</span><a class="linkbtn" target="_blank" rel="noopener" href="${safeHtml(discordInviteUrl("1510677346787659777","388160",discordGuildId))}">Lichtbuff-Bot einladen</a><a class="linkbtn" target="_blank" rel="noopener" href="${safeHtml(discordInviteUrl("1527793332346945537","2147560448",discordGuildId))}">P0-Anmelder-Bot einladen</a></div>`}
    <button type="button" id="refreshReadiness">Bereitschaft erneut prüfen</button>
  `;
  document.getElementById("refreshReadiness")?.addEventListener("click", loadSetup);
}
function renderReadiness(readiness){
  if(!readiness) return "";
  const checks = readiness.checks || {};
  const rows = [
    ["masterConfigured", "Master-Code gespeichert"],
    ["discordServerConfigured", "Discord-Server verbunden"],
    ["botChannelsSynced", "Bot-Channels synchronisiert"],
    ["layoutConfigured", "Gildenlayout gespeichert"]
  ];
  return `<div class="readiness">
    <strong>${readiness.ready ? "✅ Gilde ist startklar" : "Einrichtung noch nicht vollständig"}</strong>
    ${rows.map(([key,label]) => `<span class="check ${checks[key] ? "done" : ""}"><i>${checks[key] ? "✓" : "!"}</i>${label}</span>`).join("")}
  </div>`;
}
async function loadSetup(){
  if(!token){ setStatus("Freischaltlink fehlt.", "bad"); return; }
  try{
    const response = await fetch(API_URL + "?action=getGuildSetup&token=" + encodeURIComponent(token) + "&t=" + Date.now(), { cache:"no-store" });
    const result = await response.json();
    if(!result.success) throw new Error(result.error || "Freischaltlink konnte nicht geladen werden.");
    const app = result.application || {};
    setValue("guildName", app.guildName);
    setValue("lootName", app.lootName || app.guildName);
    setValue("server", app.server);
    setValue("guildPin", app.guildPin || app.desiredGuildPin);
    setValue("discordGuildId", app.discordGuildId);
    setValue("logoUrl", app.logoUrl);
    setValue("backgroundUrl", app.backgroundUrl);
    setValue("primaryColor", app.primaryColor);
    setValue("accentColor", app.accentColor);
    setStatus(app.status === "completed" ? "Diese Gilde wurde bereits eingerichtet." : "Freischaltlink gültig. Einrichtung kann abgeschlossen werden.", "good");
    if(app.status === "completed"){
      form.querySelector(".grid").hidden=true;
      form.querySelector(".actions").hidden=true;
      resultLinks.hidden = false;
      renderResultLinks(result);
    }
  }catch(error){
    setStatus(error.message || "Freischaltlink konnte nicht geladen werden.", "bad");
  }
}
form.addEventListener("submit", async event => {
  event.preventDefault();
  const payload = Object.fromEntries(new FormData(form).entries());
  setStatus("Gilde wird eingerichtet ...", "");
  try{
    const response = await fetch(API_URL, {
      method:"POST",
      headers:{ "Content-Type":"application/json" },
      body:JSON.stringify({ action:"completeGuildSetup", token, ...payload })
    });
    const result = await response.json();
    if(!result.success) throw new Error(result.error || "Gilde konnte nicht eingerichtet werden.");
    setStatus("Gilde ist eingerichtet.", "good");
    resultLinks.hidden = false;
    renderResultLinks(result);
  }catch(error){
    setStatus(error.message || "Gilde konnte nicht eingerichtet werden.", "bad");
  }
});
form.elements.setupProfile?.addEventListener("change",event=>{
  const profile=event.target.value;
  form.elements.priority_p1_enabled.checked=true;
  form.elements.priority_p2_enabled.checked=true;
  form.elements.priority_p3_enabled.checked=profile!=="casual";
  const progress=profile==="progress";
  form.elements.recruitEnabled.checked=progress;
  form.elements.poReleaseApplications.checked=progress;
  ["bwl","aq40","naxx"].forEach(raid=>{form.elements[`recruit_raid_${raid}`].checked=progress;});
  ["p1","p2","p3","p0plus"].forEach(key=>{form.elements[`recruit_priority_${key}`].checked=progress&&["p2","p3"].includes(key);});
});
loadSetup();
</script>
</body>
</html>
