<header class="top"><img src="images/content.png" alt=""><div><h1>Raidaufstellung</h1><p>Spielerbank · Gruppenplanung · MRT-/Addon-Export</p></div><button class="btn back" onclick="location.href=withGuild('gildenleitung.html')">← Gildenleitung</button></header>
<main class="wrap"><section class="toolbar">
 <div class="field"><label>Aktuellen Raidanmelder auswählen</label><select id="raid" onchange="loadRaidSignups()"><option value="">Raidanmelder werden geladen …</option></select></div>

 <div class="field"><label>Master-Code</label><input id="master" type="password" placeholder="Master-Code"></div>
 <button class="btn gold" onclick="loadPlayers()">Anmelder neu laden</button><button class="btn good" onclick="saveSetup()">Aufstellung speichern</button><button class="btn" onclick="loadSetup()">Gespeicherte laden</button><button class="btn danger" onclick="clearGroups()">Gruppen leeren</button>
 <div id="status" class="status"></div>
</section><div class="layout"><aside class="panel"><div class="roster-head"><input class="search" id="search" placeholder="Charakter oder Klasse suchen" oninput="renderRoster()"></div><div id="roster" class="roster"><div class="empty">Spielerbank laden</div></div></aside>
<section><div id="groups" class="groups"></div><div id="counts" class="counts"></div><section id="tasks" class="panel tasks"><div class="tasks-head"><div><h2>Aufgabenverteilung</h2><span id="taskSubtitle" class="status">Raid auswählen</span></div><div><button id="bossMenuButton" class="btn" onclick="toggleBossMenu()">Bosse auswählen</button> <button class="btn" onclick="togglePlayerView()">Spieleransicht</button></div></div><div id="bossMenu" class="boss-menu hidden"></div><div id="taskGrid" class="task-grid"></div></section><div class="panel" style="margin-top:16px"><strong>MRT-/Addon-Gruppenexport</strong><p style="color:var(--muted)">Die Liste kann vom vorgesehenen WoW-Addon eingelesen werden. Format: Charakter = Gruppe.</p><textarea id="export" class="export" readonly></textarea><button class="btn gold" onclick="copyExport()">Export kopieren</button></div></section></div></main><div id="playerModal" class="player-modal hidden" onclick="if(event.target===this)closePlayerView()"><div class="player-modal-shell"><header class="player-modal-head"><img src="images/content.png" alt="" style="width:52px;height:52px"><div><h2 id="playerModalTitle">Raidübersicht</h2><p id="playerModalSub"></p></div><button class="btn" onclick="closePlayerView()">✕ Schließen</button></header><div id="playerModalBody" class="player-modal-body"></div></div></div>

function withGuild(page){return page+'?guild='+encodeURIComponent(guild)}
function esc(v){return String(v||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function normPlayer(row){const name=String(row.player||row.char||row.character||row.characterName||row.player_name||row.name||'').trim();return {id:String(row.characterId||row.character_id||row.charId||row.id||name),name,server:String(row.server||''),className:String(row.className||row.class_name||row.Klasse||row.class||''),role:String(row.role||row.raidRole||''),spec:String(row.specialization||row.specialisation||row.spec||row.skillung||String(row.note||'').replace(/^\s*Skillung\s*:\s*/i,'')).trim(),status:String(row.status||'signed')};}
function roleKey(c){const r=String(c.role||'').toLowerCase();return r.includes('tank')?'tank':r.includes('heal')?'heal':'dd'}
function roleLabel(c){return roleKey(c)==='tank'?'🛡 TANK':roleKey(c)==='heal'?'✚ HEAL':'⚔ DD'}

function openSlotSearch(event,group,slot){if(event.target.closest('.slot-search'))return;event.stopPropagation();document.querySelectorAll('.slot-search').forEach(x=>x.remove());const host=event.currentTarget,current=groups[group][slot],rect=host.getBoundingClientRect(),box=document.createElement('div');box.className='slot-search';box.innerHTML=`<input type="search" placeholder="Name oder Anfangsbuchstaben …" oninput="filterSlotSearch(this,${group},${slot})"><div class="slot-results"></div>`;document.body.appendChild(box);const width=Math.min(390,window.innerWidth-24),left=Math.max(12,Math.min(rect.left,window.innerWidth-width-12)),estimated=350,top=rect.bottom+8+estimated>window.innerHeight?Math.max(12,rect.top-estimated-8):rect.bottom+8;box.style.left=left+'px';box.style.top=top+'px';filterSlotSearch(box.querySelector('input'),group,slot);box.querySelector('input').focus();if(current)box.querySelector('.slot-results').insertAdjacentHTML('afterbegin',`<button class="slot-result slot-remove" type="button" onclick="chooseSlotCharacter(event,${group},${slot},'')">Platz leeren</button>`)}
function filterSlotSearch(input,group,slot){const q=input.value.trim().toLowerCase(),used=usedIds(),current=groups[group][slot]?.id;const list=chars.filter(c=>(!used.has(c.id)||c.id===current)&&(!q||`${c.name} ${c.className} ${c.spec}`.toLowerCase().includes(q))).sort((a,b)=>Number(b.signedUp)-Number(a.signedUp)||roleOrder(a)-roleOrder(b)||a.name.localeCompare(b.name));input.nextElementSibling.innerHTML=list.slice(0,40).map(c=>slotCandidateHtml(c,group,slot)).join('')||'<div class="picker-empty">Kein Charakter gefunden</div>'}

function renderCounts(){const all=groups.flat(),by={},signed=chars.filter(c=>c.signedUp).length;all.forEach(c=>by[c.className]=(by[c.className]||0)+1);document.getElementById('counts').innerHTML=`<span class="pill"><b>${all.length}</b> / 40 eingeplant</span><span class="pill">✓ <b>${signed}</b> angemeldet</span><span class="pill"><b>${chars.length}</b> Charaktere insgesamt</span>`+Object.entries(by).sort().map(([k,v])=>`<span class="pill">${esc(k)}: <b>${v}</b></span>`).join('');document.getElementById('export').value=['LichtLoot Raidaufstellung',`Gilde=${guild}`,`Raid=${document.getElementById('raid').value}`,`Name=${document.getElementById('name').value}`,...groups.flatMap((g,i)=>g.map(c=>`${c.name}=${i+1}`))].join('\n')}
async function api(action,extra={}){const q=new URLSearchParams({action,guild,guildSlug:guild,masterCode:document.getElementById('master').value.trim(),t:Date.now(),...extra});const r=await fetch(API+'?'+q).then(x=>x.json());if(!r.success)throw Error(r.error||'Daten konnten nicht geladen werden.');return r}
async function loadPlayers(){const master=document.getElementById('master').value.trim();if(!master){setStatus('Bitte Master-Code eingeben.',true);return}setStatus('Spielerbank und Raids werden geladen …');try{const r=await api('getGuildLeadershipOverview');const seen=new Set();playerBank=(r.players||[]).map(normPlayer).filter(c=>c.name&&!seen.has(c.name.toLowerCase())&&(seen.add(c.name.toLowerCase()),true));chars=playerBank.map(c=>({...c,signedUp:false}));raids=(r.raids||[]).filter(x=>!['archiviert','gelöscht','deleted'].includes(String(x.status||'').toLowerCase())).sort((a,b)=>`${b.raidDate||''} ${b.raidTime||''}`.localeCompare(`${a.raidDate||''} ${a.raidTime||''}`));document.getElementById('raid').innerHTML='<option value="">Raid auswählen</option>'+raids.map(x=>`<option value="${esc(x.raidId||x.id)}">${esc(x.raidName||x.raid||'Raid')} · ${esc(x.raidDate||'')} ${esc(x.raidTime||'')}</option>`).join('');try{localStorage.setItem(masterKey,master)}catch(_){}renderGroups();setStatus(`${chars.length} Charaktere aus der Spielerbank und ${raids.length} Raids geladen.`)}catch(e){setStatus(e.message,true)}}
async function loadRaidSignups(){const raidId=document.getElementById('raid').value;if(!raidId)return;setStatus('Raidanmeldungen werden abgeglichen …');try{const selected=raids.find(x=>String(x.raidId||x.id)===raidId)||{};document.getElementById('name').value=[selected.raidName||selected.raid,selected.raidDate,selected.raidTime].filter(Boolean).join(' · ');const r=await api('getRaidHelper',{raidId});const rows=[...(r.signups||[]),...(r.externalSignups||[])].filter(x=>!['declined','absent','rejected','abwesend','verworfen'].includes(String(x.status||'').toLowerCase())).map(normPlayer);const signups=new Map(rows.map(c=>[c.name.toLowerCase(),c]));chars=playerBank.map(bank=>{const s=signups.get(bank.name.toLowerCase());return {...bank,...(s||{}),id:bank.id,name:bank.name,className:s?.className||bank.className,server:s?.server||bank.server,role:s?.role||bank.role,signedUp:Boolean(s)}});rows.forEach(s=>{if(!chars.some(c=>c.name.toLowerCase()===s.name.toLowerCase()))chars.push({...s,signedUp:true})});chars.sort((a,b)=>Number(b.signedUp)-Number(a.signedUp)||a.className.localeCompare(b.className)||a.name.localeCompare(b.name));groups=Array.from({length:8},()=>[]);renderGroups();setStatus(`${chars.filter(c=>c.signedUp).length} angemeldete Charaktere markiert · ${chars.length} Charaktere insgesamt.`)}catch(e){setStatus(e.message,true)}}
function currentRaidType(){const select=document.getElementById('raid'),r=raids.find(x=>String(x.raidId||x.id)===select.value)||{};const t=[r.raidName,r.raid,r.name,r.title,select.options[select.selectedIndex]?.text].filter(Boolean).join(' ').toUpperCase();if(t.includes('MOLTEN CORE')||/(^|[^A-Z])MC([^A-Z]|$)/.test(t))return 'MC';if(t.includes('BLACKWING LAIR')||/(^|[^A-Z])BWL([^A-Z]|$)/.test(t))return 'BWL';return ''}
function assignmentCandidates(title,slot){const field=String(slot||'').toLowerCase(),text=(title+' '+slot).toLowerCase();let list=chars.filter(c=>c.signedUp);if(field.includes('heiler')||field.includes('heal'))list=list.filter(c=>roleKey(c)==='heal');else if(field.includes('tank'))list=list.filter(c=>roleKey(c)==='tank');const classFilter=['Priester','Magier','Druide','Paladin','Jäger'].find(name=>text.includes(name.toLowerCase()));if(classFilter)list=list.filter(c=>c.className===classFilter);return list.sort((a,b)=>roleOrder(a)-roleOrder(b)||a.className.localeCompare(b.className)||a.name.localeCompare(b.name))}

function syncMarkerAssignment(key,value){const parts=key.split('|');if(parts.length<3||parts[1]!=='Tank → Heiler')return;const type=parts[0],slot=parts.slice(2).join('|'),match=slot.match(/^(Skull|Cross|Square|Moon|Diamond)\s+(Tank|Heiler 1|Heiler 2)$/);if(!match)return;const icons={Skull:'💀',Cross:'❌',Square:'🟦',Moon:'🌙',Diamond:'🔷'},marker=icons[match[1]],role=match[2];for(const [title,,slots] of taskBoards[type]||[]){for(const target of [...slots,...(customSlots[type+'|'+title]||[])]){const text=String(target);if(!text.startsWith(marker))continue;const isTank=/tank/i.test(text),isHeal=/heiler|heal/i.test(text);if(role==='Tank'&&isTank)assignments[type+'|'+title+'|'+target]=value;if(role==='Heiler 1'&&isHeal&&!/heiler\s*2/i.test(text))assignments[type+'|'+title+'|'+target]=value;if(role==='Heiler 2'&&isHeal&&/heiler\s*2/i.test(text))assignments[type+'|'+title+'|'+target]=value;}}

function tankAssignmentCard(type){const marks=[['💀','Skull'],['❌','Cross'],['🟦','Square'],['🌙','Moon'],['🔷','Diamond']];return `<article class="task-card wide"><h3>Tank- und Heilerzuordnung</h3><div class="assignment-table tanks"><div class="assignment-cell head">Ziel</div><div class="assignment-cell head">Tank</div><div class="assignment-cell head">Heiler 1</div><div class="assignment-cell head">Heiler 2</div>${marks.map(([icon,name])=>{const cells=['Tank','Heiler 1','Heiler 2'].map(role=>{const p=assignmentPicker(type,'Tank → Heiler',name+' '+role);return `<div class="assignment-cell ${p.chosen?'assigned':''}" style="--row-color:${esc(p.color)}">${p.html}</div>`}).join('');return `<div class="assignment-cell marker">${icon}</div>${cells}`}).join('')}</div></article>`}

function renderTasks(){const type=currentRaidType(),box=document.getElementById('taskGrid'),root=document.getElementById('tasks'),bossButton=document.getElementById('bossMenuButton'),bossMenu=document.getElementById('bossMenu');root.classList.toggle('bwl-board',type==='BWL');root.classList.toggle('mc-board',type==='MC');bossButton.classList.toggle('hidden',!type);if(!type)bossMenu.classList.add('hidden');document.getElementById('taskSubtitle').textContent=type?`${type}: Felder anklicken und angemeldete Charaktere zuweisen`:'Für diese erste Version bitte BWL oder MC auswählen.';if(!type){box.innerHTML='<div class="empty">BWL- oder MC-Raid auswählen</div>';return}const cards=[tankAssignmentCard(type),buffAssignmentCard(type)];for(const [title,kind,slots] of taskBoards[type]){if(title==='Tank → Heiler'||title==='Buffs & Dispels')continue;if(type==='MC'&&mcBosses.includes(title)&&!visibleMcBosses.has(title))continue;if(type==='BWL'&&bwlBosses.includes(title)&&!visibleBwlBosses.has(title))continue;const key=type+'|'+title,extra=customSlots[key]||[],icon=bossIcon(title),heading=kind==='boss'&&icon?`<img class="boss-title-icon" src="${icon}" alt=""><span>${esc(title)}</span>`:esc(title);cards.push(`<article class="task-card ${kind}"><h3>${heading}</h3>${slots.map(slot=>taskRowHtml(type,title,slot)).join('')}${extra.map(slot=>taskRowHtml(type,title,slot,true)).join('')}<div class="task-actions"><button class="task-add" onclick="addTaskField('${esc(type)}','${esc(title)}')">+ Feld hinzufügen</button></div></article>`)}box.innerHTML=cards.join('')}

function setBossVisible(type,name,shown){const visible=type==='MC'?visibleMcBosses:visibleBwlBosses;if(shown)visible.add(name);else visible.delete(name);renderTasks();renderBossMenu()}
let ownCharacterNames=new Set();
async function loadOwnCharacterNames(){try{const key='lichtlootPlayerPin_'+guild,pin=sessionStorage.getItem(key)||localStorage.getItem(key)||'';if(!pin)return;const q=new URLSearchParams({action:'getCharactersByPin',guild,pin,t:Date.now()});const data=await fetch(API+'?'+q).then(r=>r.json());const rows=data.characters||data.entries||data.chars||[];ownCharacterNames=new Set(rows.map(x=>String(x.char||x.player||x.name||x.Charakter||'').trim().toLowerCase()).filter(Boolean))}catch(_){ownCharacterNames=new Set()}}
function playerMemberHtml(c){const own=ownCharacterNames.has(c.name.toLowerCase());return `<div class="player-summary-member ${own?'is-own':''}" style="--class:${colors[c.className]||'#64748b'}"><span class="role-badge ${roleKey(c)}">${roleLabel(c)}</span><img src="${esc(specIcon(c))}" alt=""><div><b>${esc(c.name)}</b><small>${esc([c.className,c.spec].filter(Boolean).join(' · '))}</small></div></div>`}
function summaryCard(title,kind,rows){if(!rows.length)return '';const icon=bossIcon(title);return `<section class="player-summary-card ${kind}"><h3>${icon?`<img src="${icon}" alt="">`:''}<span>${esc(title)}</span></h3>${rows.map(([slot,name])=>`<div class="player-summary-task ${ownCharacterNames.has(String(name).toLowerCase())?'is-own':''}"><span>${esc(slot)}</span><b>${esc(name)}</b></div>`).join('')}</section>`}
function ownClass(name){return ownCharacterNames.has(String(name||'').toLowerCase())?'is-own':''}
function renderPlayerModal(){const type=currentRaidType(),body=document.getElementById('playerModalBody'),marks=[['💀','Skull'],['❌','Cross'],['🟦','Square'],['🌙','Moon'],['🔷','Diamond']];document.getElementById('playerModalTitle').textContent=document.getElementById('name').value||'Raidübersicht';document.getElementById('playerModalSub').textContent=`${type||'Raid'} · Einteilungen und persönliche Aufgaben`;const tank=`<section class="player-sheet-card wide"><h3>Tank- und Heilerzuordnung</h3><div class="sheet-grid tank"><div class="sheet-cell head">Ziel</div><div class="sheet-cell head">Tank</div><div class="sheet-cell head">Heiler 1</div><div class="sheet-cell head">Heiler 2</div>${marks.map(([icon,key])=>{const values=['Tank','Heiler 1','Heiler 2'].map(role=>assignments[type+'|Tank → Heiler|'+key+' '+role]||'');return `<div class="sheet-cell marker">${icon}</div>${values.map(v=>`<div class="sheet-cell player ${ownClass(v)} ${v?'':'sheet-empty'}">${esc(v||'–')}</div>`).join('')}`}).join('')}</div></section>`;const classes=['Priester','Magier','Druide','Paladin'],buff=`<section class="player-sheet-card wide"><h3>Buffeinteilung + zuerst Decursen / Dispellen</h3><div class="sheet-grid buff"><div class="sheet-cell head">Gruppe</div>${classes.map(c=>`<div class="sheet-cell head">${c}</div>`).join('')}${Array.from({length:8},(_,i)=>`<div class="sheet-cell head">Grp ${i+1}</div>${classes.map(c=>{const v=assignments[type+'|Buffs & Dispels|Grp '+(i+1)+' '+c]||'';return `<div class="sheet-cell player ${ownClass(v)} ${v?'':'sheet-empty'}">${esc(v||'–')}</div>`}).join('')}`).join('')}</div></section>`;const cards=[tank,buff];for(const [title,kind,baseSlots] of taskBoards[type]||[]){if(title==='Tank → Heiler'||title==='Buffs & Dispels')continue;if(type==='MC'&&mcBosses.includes(title)&&!visibleMcBosses.has(title))continue;if(type==='BWL'&&bwlBosses.includes(title)&&!visibleBwlBosses.has(title))continue;const rows=[...baseSlots,...(customSlots[type+'|'+title]||[])].map(slot=>[slot,assignments[type+'|'+title+'|'+slot]]).filter(x=>x[1]);if(!rows.length)continue;const icon=bossIcon(title);cards.push(`<section class="player-sheet-card ${kind}"><h3>${icon?`<img src="${icon}" alt="">`:''}<span>${esc(title)}</span></h3>${rows.map(([slot,name])=>`<div class="sheet-list-row ${ownClass(name)}"><span>${esc(slot)}</span><b>${esc(name)}</b></div>`).join('')}</section>`)}body.innerHTML=`<div class="player-sheet-layout">${cards.join('')}</div>`}
async function togglePlayerView(){await loadOwnCharacterNames();renderPlayerModal();document.getElementById('playerModal').classList.remove('hidden');document.body.style.overflow='hidden'}
function closePlayerView(){document.getElementById('playerModal').classList.add('hidden');document.body.style.overflow=''}
function storageKey(){return `lichtlootRaidSetup_${guild}_${document.getElementById('raid').value||'kein-raid'}`}
function saveSetup(){localStorage.setItem(storageKey(),JSON.stringify({raid:document.getElementById('raid').value,name:document.getElementById('name').value,groups:groups.map(g=>g.map(c=>c.id)),assignments,customSlots,visibleMcBosses:[...visibleMcBosses],visibleBwlBosses:[...visibleBwlBosses]}));setStatus('Aufstellung, Aufgaben und eigene Felder gespeichert.')}
function loadSetup(){try{const d=JSON.parse(localStorage.getItem(storageKey())||'null');if(!d)throw Error('Keine gespeicherte Aufstellung gefunden.');groups=(d.groups||[]).map(ids=>ids.map(id=>chars.find(c=>c.id===id)).filter(Boolean));while(groups.length<8)groups.push([]);assignments=d.assignments||{};customSlots=d.customSlots||{};visibleMcBosses=new Set(Array.isArray(d.visibleMcBosses)?d.visibleMcBosses:mcBosses);visibleBwlBosses=new Set(Array.isArray(d.visibleBwlBosses)?d.visibleBwlBosses:bwlBosses);renderGroups();renderBossMenu();setStatus('Aufstellung, Aufgaben und eigene Felder geladen.')}catch(e){setStatus(e.message,true)}}
function clearGroups(){if(confirm('Alle Gruppen leeren?')){groups=Array.from({length:8},()=>[]);renderGroups()}}
async function copyExport(){await navigator.clipboard.writeText(document.getElementById('export').value);setStatus('Export kopiert.')}
function setStatus(t,bad){const e=document.getElementById('status');e.textContent=t;e.style.color=bad?'#f87171':'#86efac'}
try{document.getElementById('master').value=sessionStorage.getItem(masterKey)||localStorage.getItem(masterKey)||''}catch(_){}renderGroups();if(document.getElementById('master').value)loadPlayers();
</script></body></html>
