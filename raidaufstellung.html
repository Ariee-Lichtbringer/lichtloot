<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>LichtLoot – Raidaufstellung</title><link rel="icon" href="images/content.png">
<style>
:root{--gold:#facc15;--bg:#030817;--panel:#0b1428;--line:#283858;--text:#f8fafc;--muted:#9fb0cc}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#172038 0,#030817 42%);color:var(--text);font:15px system-ui,-apple-system,sans-serif}button,input,select,textarea{font:inherit}.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:14px;padding:12px 20px;background:#050b18eb;border-bottom:1px solid #334155}.top img{width:48px;height:48px;object-fit:contain}.top h1{margin:0;color:var(--gold);font-size:22px}.top p{margin:2px 0;color:var(--muted)}.top .back{margin-left:auto}.wrap{max-width:1600px;margin:auto;padding:20px}.toolbar,.panel{background:#081124e8;border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:0 16px 40px #0005}.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:end;margin-bottom:16px}.field{display:grid;gap:5px}.field label{font-size:11px;font-weight:900;color:#9fb0cc;text-transform:uppercase}.field input,.field select,.search{background:#050b18;border:1px solid #3a4c70;color:#fff;border-radius:8px;padding:9px 11px}.btn{border:1px solid #465a80;background:#15223d;color:#fff;border-radius:8px;padding:9px 13px;font-weight:850;cursor:pointer}.btn.gold{background:#a47c00;border-color:#facc15}.btn.good{background:#087546;border-color:#22c55e}.btn.danger{background:#751f2a;border-color:#ef4444}.status{color:var(--muted);min-height:20px}.layout{display:grid;grid-template-columns:330px minmax(0,1fr);gap:16px}.roster-head{display:flex;gap:8px;margin-bottom:10px}.roster-head .search{width:100%}.roster{display:grid;gap:7px;max-height:72vh;overflow:auto;padding-right:4px}.char{display:flex;align-items:center;gap:9px;background:#101c33;border:1px solid #2e4268;border-left:4px solid var(--class,#64748b);border-radius:9px;padding:9px;cursor:grab}.char small{display:block;color:var(--muted)}.char.used{opacity:.35}.groups{display:grid;grid-template-columns:repeat(4,minmax(190px,1fr));gap:12px}.group{background:#071020;border:1px solid #334b72;border-radius:12px;min-height:300px;overflow:hidden}.group h3{margin:0;padding:11px 12px;background:#13213c;color:var(--gold);display:flex;justify-content:space-between}.slots{display:grid;gap:7px;padding:9px;min-height:245px}.slot{min-height:45px;border:1px dashed #415477;border-radius:8px;padding:5px}.slot .char{cursor:grab;padding:7px}.counts{margin-top:16px;display:flex;flex-wrap:wrap;gap:8px}.pill{background:#111d34;border:1px solid #334b72;border-radius:999px;padding:7px 11px}.export{width:100%;min-height:170px;margin-top:12px;background:#030817;color:#dbeafe;border:1px solid #334b72;border-radius:10px;padding:12px;font-family:ui-monospace,monospace}.empty{padding:16px;color:var(--muted);text-align:center}@media(max-width:1100px){.groups{grid-template-columns:repeat(2,1fr)}}@media(max-width:760px){.layout{grid-template-columns:1fr}.groups{grid-template-columns:1fr}.roster{max-height:320px}}
.signup-check{margin-left:auto;color:#64748b;font-size:11px;font-weight:900;white-space:nowrap}.char.signed-up .signup-check{color:#86efac}
</style></head><body>
<header class="top"><img src="images/content.png" alt=""><div><h1>Raidaufstellung</h1><p>Spielerbank · Gruppenplanung · MRT-/Addon-Export</p></div><button class="btn back" onclick="location.href=withGuild('gildenleitung.html')">← Gildenleitung</button></header>
<main class="wrap"><section class="toolbar">
 <div class="field"><label>Aktuellen Raidanmelder auswählen</label><select id="raid" onchange="loadRaidSignups()"><option value="">Raidanmelder werden geladen …</option></select></div>
 <div class="field"><label>Bezeichnung/Datum</label><input id="name" readonly placeholder="Wird aus dem Raid übernommen"></div>
 <div class="field"><label>Master-Code</label><input id="master" type="password" placeholder="Master-Code"></div>
 <button class="btn gold" onclick="loadPlayers()">Anmelder neu laden</button><button class="btn good" onclick="saveSetup()">Aufstellung speichern</button><button class="btn" onclick="loadSetup()">Gespeicherte laden</button><button class="btn danger" onclick="clearGroups()">Gruppen leeren</button>
 <div id="status" class="status"></div>
</section><div class="layout"><aside class="panel"><div class="roster-head"><input class="search" id="search" placeholder="Charakter oder Klasse suchen" oninput="renderRoster()"></div><div id="roster" class="roster"><div class="empty">Spielerbank laden</div></div></aside>
<section><div id="groups" class="groups"></div><div id="counts" class="counts"></div><div class="panel" style="margin-top:16px"><strong>MRT-/Addon-Gruppenexport</strong><p style="color:var(--muted)">Die Liste kann vom vorgesehenen WoW-Addon eingelesen werden. Format: Charakter = Gruppe.</p><textarea id="export" class="export" readonly></textarea><button class="btn gold" onclick="copyExport()">Export kopieren</button></div></section></div></main>
<script>
const API='https://lichtloot-production.up.railway.app/api/apps-script';
const params=new URLSearchParams(location.search);const guild=(params.get('guild')||'lichtloot').toLowerCase();
const masterKey='lichtlootGuildMasterCode_'+guild;let chars=[];let playerBank=[];let raids=[];let groups=Array.from({length:8},()=>[]);
const colors={Krieger:'#c79c6e',Paladin:'#f58cba','Jäger':'#abd473',Schurke:'#fff569',Priester:'#fff',Schamane:'#0070de',Magier:'#69ccf0',Hexenmeister:'#9482c9',Druide:'#ff7d0a'};
function withGuild(page){return page+'?guild='+encodeURIComponent(guild)}
function esc(v){return String(v||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function normPlayer(row){const name=String(row.player||row.char||row.character||row.characterName||row.player_name||row.name||'').trim();return {id:String(row.characterId||row.character_id||row.charId||row.id||name),name,server:String(row.server||''),className:String(row.className||row.class_name||row.Klasse||row.class||''),role:String(row.role||row.raidRole||''),status:String(row.status||'signed')};}
function usedIds(){return new Set(groups.flat().map(c=>c.id))}
function charHtml(c){return `<div class="char ${c.signedUp?'signed-up':''}" draggable="true" data-id="${esc(c.id)}" style="--class:${colors[c.className]||'#64748b'}"><div><strong>${esc(c.name)}</strong><small>${esc([c.className,c.role,c.server].filter(Boolean).join(' · '))}</small></div><span class="signup-check">${c.signedUp?'✓ Angemeldet':'○ Nicht angemeldet'}</span></div>`}
function bindDrag(){document.querySelectorAll('.char').forEach(el=>el.ondragstart=e=>e.dataTransfer.setData('text/plain',el.dataset.id));document.querySelectorAll('.slot,.roster').forEach(el=>{el.ondragover=e=>e.preventDefault();el.ondrop=e=>{e.preventDefault();moveChar(e.dataTransfer.getData('text/plain'),el.dataset.group);};});}
function renderRoster(){const q=document.getElementById('search').value.toLowerCase(),used=usedIds();const list=chars.filter(c=>!q||`${c.name} ${c.className} ${c.role}`.toLowerCase().includes(q));document.getElementById('roster').innerHTML=list.map(c=>`<div class="${used.has(c.id)?'used':''}">${charHtml(c)}</div>`).join('')||'<div class="empty">Keine Charaktere gefunden</div>';bindDrag()}
function renderGroups(){document.getElementById('groups').innerHTML=groups.map((members,i)=>`<div class="group"><h3><span>Gruppe ${i+1}</span><small>${members.length}/5</small></h3><div class="slots" data-group="${i}">${Array.from({length:5},(_,s)=>`<div class="slot" data-group="${i}">${members[s]?charHtml(members[s]):''}</div>`).join('')}</div></div>`).join('');renderRoster();renderCounts();bindDrag()}
function moveChar(id,target){let found=chars.find(c=>c.id===id);groups=groups.map(g=>g.filter(c=>c.id!==id));if(target!==undefined&&target!==''&&found){const n=Number(target);if(groups[n].length<5)groups[n].push(found)}renderGroups()}
function renderCounts(){const all=groups.flat(),by={},signed=chars.filter(c=>c.signedUp).length;all.forEach(c=>by[c.className]=(by[c.className]||0)+1);document.getElementById('counts').innerHTML=`<span class="pill"><b>${all.length}</b> / 40 eingeplant</span><span class="pill">✓ <b>${signed}</b> angemeldet</span><span class="pill"><b>${chars.length}</b> Charaktere insgesamt</span>`+Object.entries(by).sort().map(([k,v])=>`<span class="pill">${esc(k)}: <b>${v}</b></span>`).join('');document.getElementById('export').value=['LichtLoot Raidaufstellung',`Gilde=${guild}`,`Raid=${document.getElementById('raid').value}`,`Name=${document.getElementById('name').value}`,...groups.flatMap((g,i)=>g.map(c=>`${c.name}=${i+1}`))].join('\n')}
async function api(action,extra={}){const q=new URLSearchParams({action,guild,guildSlug:guild,masterCode:document.getElementById('master').value.trim(),t:Date.now(),...extra});const r=await fetch(API+'?'+q).then(x=>x.json());if(!r.success)throw Error(r.error||'Daten konnten nicht geladen werden.');return r}
async function loadPlayers(){const master=document.getElementById('master').value.trim();if(!master){setStatus('Bitte Master-Code eingeben.',true);return}setStatus('Spielerbank und Raids werden geladen …');try{const r=await api('getGuildLeadershipOverview');const seen=new Set();playerBank=(r.players||[]).map(normPlayer).filter(c=>c.name&&!seen.has(c.name.toLowerCase())&&(seen.add(c.name.toLowerCase()),true));chars=playerBank.map(c=>({...c,signedUp:false}));raids=(r.raids||[]).filter(x=>!['archiviert','gelöscht','deleted'].includes(String(x.status||'').toLowerCase())).sort((a,b)=>`${b.raidDate||''} ${b.raidTime||''}`.localeCompare(`${a.raidDate||''} ${a.raidTime||''}`));document.getElementById('raid').innerHTML='<option value="">Raid auswählen</option>'+raids.map(x=>`<option value="${esc(x.raidId||x.id)}">${esc(x.raidName||x.raid||'Raid')} · ${esc(x.raidDate||'')} ${esc(x.raidTime||'')}</option>`).join('');try{localStorage.setItem(masterKey,master)}catch(_){}renderGroups();setStatus(`${chars.length} Charaktere aus der Spielerbank und ${raids.length} Raids geladen.`)}catch(e){setStatus(e.message,true)}}
async function loadRaidSignups(){const raidId=document.getElementById('raid').value;if(!raidId)return;setStatus('Raidanmeldungen werden abgeglichen …');try{const selected=raids.find(x=>String(x.raidId||x.id)===raidId)||{};document.getElementById('name').value=[selected.raidName||selected.raid,selected.raidDate,selected.raidTime].filter(Boolean).join(' · ');const r=await api('getRaidHelper',{raidId});const rows=[...(r.signups||[]),...(r.externalSignups||[])].filter(x=>!['declined','absent','rejected','abwesend','verworfen'].includes(String(x.status||'').toLowerCase())).map(normPlayer);const signups=new Map(rows.map(c=>[c.name.toLowerCase(),c]));chars=playerBank.map(bank=>{const s=signups.get(bank.name.toLowerCase());return {...bank,...(s||{}),id:bank.id,name:bank.name,className:s?.className||bank.className,server:s?.server||bank.server,role:s?.role||bank.role,signedUp:Boolean(s)}});rows.forEach(s=>{if(!chars.some(c=>c.name.toLowerCase()===s.name.toLowerCase()))chars.push({...s,signedUp:true})});chars.sort((a,b)=>Number(b.signedUp)-Number(a.signedUp)||a.className.localeCompare(b.className)||a.name.localeCompare(b.name));groups=Array.from({length:8},()=>[]);renderGroups();setStatus(`${chars.filter(c=>c.signedUp).length} angemeldete Charaktere markiert · ${chars.length} Charaktere insgesamt.`)}catch(e){setStatus(e.message,true)}}
function storageKey(){return `lichtlootRaidSetup_${guild}_${document.getElementById('raid').value||'kein-raid'}`}
function saveSetup(){localStorage.setItem(storageKey(),JSON.stringify({raid:document.getElementById('raid').value,name:document.getElementById('name').value,groups:groups.map(g=>g.map(c=>c.id))}));setStatus('Aufstellung gespeichert.')}
function loadSetup(){try{const d=JSON.parse(localStorage.getItem(storageKey())||'null');if(!d)throw Error('Keine gespeicherte Aufstellung gefunden.');groups=(d.groups||[]).map(ids=>ids.map(id=>chars.find(c=>c.id===id)).filter(Boolean));while(groups.length<8)groups.push([]);renderGroups();setStatus('Aufstellung geladen.')}catch(e){setStatus(e.message,true)}}
function clearGroups(){if(confirm('Alle Gruppen leeren?')){groups=Array.from({length:8},()=>[]);renderGroups()}}
async function copyExport(){await navigator.clipboard.writeText(document.getElementById('export').value);setStatus('Export kopiert.')}
function setStatus(t,bad){const e=document.getElementById('status');e.textContent=t;e.style.color=bad?'#f87171':'#86efac'}
try{document.getElementById('master').value=sessionStorage.getItem(masterKey)||localStorage.getItem(masterKey)||''}catch(_){}renderGroups();if(document.getElementById('master').value)loadPlayers();
</script></body></html>
