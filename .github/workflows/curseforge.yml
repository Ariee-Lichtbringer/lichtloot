name: Publish GuildLoot to CurseForge
on:
  push:
    branches: [main]
    paths: [addon-release/release.json]
  workflow_dispatch:
    inputs:
      publish:
        description: Upload the checked-in addon to CurseForge
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: curseforge-guildloot
  cancel-in-progress: false
jobs:
  upload:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate ZIP and CurseForge connection, then upload release
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          PUBLISH: ${{ github.event_name == 'push' || inputs.publish }}
        run: python3 scripts/curseforge-upload.py
      - name: Save upload receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: curseforge-receipt-${{ github.run_id }}
          path: curseforge-result.json
          if-no-files-found: ignore
