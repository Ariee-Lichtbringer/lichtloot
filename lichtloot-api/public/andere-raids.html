<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <script src="guild-page-boot.js?v=20260831-1735"></script>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Andere Raids · LichtLoot</title>
  <style>
    :root{color-scheme:dark;--bg:#030817;--panel:#081221;--line:#273751;--teal:#2dd4bf;--gold:#facc15;--muted:#94a3b8}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at top,#172554 0,#07101f 38%,#020617 100%);color:#f8fafc;font:15px/1.45 Inter,system-ui,sans-serif}.shell{width:min(1180px,calc(100% - 28px));margin:0 auto;padding:24px 0 50px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}.top a,.top button{border:1px solid var(--line);border-radius:10px;background:#0f1a2d;color:#fff;padding:10px 14px;text-decoration:none;font-weight:800;cursor:pointer}.hero,.signup,.roster{border:1px solid rgba(45,212,191,.35);border-radius:18px;background:rgba(8,18,33,.95);box-shadow:0 20px 60px rgba(0,0,0,.35)}.hero{padding:22px;margin-bottom:16px}.hero h1{margin:0 0 8px;color:var(--teal);font-size:clamp(25px,4vw,42px)}.meta{display:flex;flex-wrap:wrap;gap:9px;margin-top:14px}.meta span{padding:7px 10px;border:1px solid var(--line);border-radius:999px;background:#101a2c}.signup{padding:18px;margin-bottom:16px}.signup h2,.roster h2{margin:0 0 12px;color:var(--gold)}.login-grid,.signup-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;align-items:end}.signup-grid{margin-top:12px}label{display:grid;gap:5px;color:#cbd5e1;font-size:12px;font-weight:850}input,select,button{min-height:42px;border:1px solid #3b4961;border-radius:10px;background:#07101f;color:#fff;padding:9px 11px}.primary{background:#0f766e;border-color:#2dd4bf;font-weight:900;cursor:pointer}.status{min-height:24px;margin-top:10px;color:var(--muted)}.status.good{color:#86efac}.status.bad{color:#fca5a5}.roster{padding:18px}.summary{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}.summary span{padding:7px 10px;border:1px solid var(--line);border-radius:999px;background:#101a2c;font-weight:800}.groups{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.group{overflow:hidden;border:1px solid var(--line);border-radius:13px;background:#050b18}.group h3{margin:0;padding:10px;border-bottom:1px solid var(--line);color:var(--teal)}.player{display:grid;gap:2px;padding:9px 11px;border-bottom:1px solid rgba(39,55,81,.65)}.player:last-child{border-bottom:0}.player small{color:var(--muted)}.empty{padding:24px;text-align:center;color:var(--muted)}@media(max-width:800px){.login-grid,.signup-grid{grid-template-columns:1fr 1fr}.groups{grid-template-columns:1fr 1fr}}@media(max-width:520px){.login-grid,.signup-grid,.groups{grid-template-columns:1fr}.shell{width:min(100% - 18px,1180px);padding-top:12px}}
  </style>
</head>
<body>
  <main class="shell">
    <div class="top"><a id="backLink" href="start.html">← Zur Startseite</a><button type="button" onclick="loadRaid()">↻ Aktualisieren</button></div>
    <section class="hero"><h1 id="raidTitle">Raidanmelder wird geladen …</h1><div id="raidDescription"></div><div id="raidMeta" class="meta"></div></section>
    <section class="signup">
      <h2>Für diesen Raid anmelden</h2>
      <div class="login-grid"><label>SpielerLogin / PIN<input id="playerPin" autocomplete="username" placeholder="SpielerLogin eingeben"></label><button class="primary" type="button" onclick="loadCharacters()">Charaktere laden</button></div>
      <div class="signup-grid"><label>Charakter<select id="character"><option value="">Zuerst SpielerLogin laden</option></select></label><label>Skillung<input id="spec" placeholder="z. B. Tank, Heilung, Feuer"></label><label>Status<select id="signupStatus"><option value="signed">✅ Angemeldet</option><option value="bench">🪑 Bank</option><option value="late">🕒 Verspätet</option><option value="tentative">⚖️ Vorläufig</option><option value="absent">🚫 Abwesend</option></select></label><button class="primary" type="button" onclick="saveSignup()">Anmeldung speichern</button></div>
      <div id="feedback" class="status">Anmeldung ohne Prioliste – benötigt wird nur dein LichtLoot-SpielerLogin.</div>
    </section>
    <section class="roster"><h2>Anmeldungen</h2><div id="summary" class="summary"></div><div id="roster" class="groups"><div class="empty">Wird geladen …</div></div></section>
  </main>
<script>
const params=new URLSearchParams(location.search),raidId=params.get("raidId")||"",guild=params.get("guild")||"lichtloot";
document.getElementById("backLink").href="start.html?guild="+encodeURIComponent(guild);
const esc=value=>String(value??"").replace(/[&<>"']/g,char=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[char]));
async function api(action,data={}){const query=new URLSearchParams({action,guild,guildSlug:guild,t:Date.now(),...data});const response=await fetch("/api/apps-script?"+query,{cache:"no-store"});const result=await response.json().catch(()=>({}));if(!response.ok||result.success===false)throw new Error(result.error||"LichtLoot konnte nicht geladen werden.");return result;}
let raid={},characters=[];
function roleForSpec(value){const text=String(value||"").toLowerCase();if(text.includes("tank")||text.includes("schutz"))return"tank";if(text.includes("heil")||text.includes("holy")||text.includes("resto"))return"heal";return"dd";}
function formatDate(value){if(!value)return"-";const date=new Date(String(value).slice(0,10)+"T12:00:00");return Number.isNaN(date.getTime())?value:new Intl.DateTimeFormat("de-DE",{weekday:"long",day:"2-digit",month:"2-digit",year:"numeric"}).format(date);}
function renderRoster(result){const rows=[...(result.signups||[]),...(result.externalSignups||[])],box=document.getElementById("roster"),summary=document.getElementById("summary");const active=rows.filter(row=>!['absent','abwesend'].includes(String(row.status||'').toLowerCase()));summary.innerHTML=`<span>👥 Gesamt ${active.length}${raid.maxPlayers?"/"+esc(raid.maxPlayers):""}</span><span>🛡 Tanks ${active.filter(r=>r.role==='tank').length}</span><span>✚ Heiler ${active.filter(r=>['heal','healer'].includes(r.role)).length}</span><span>⚔ DD ${active.filter(r=>r.role==='dd').length}</span>`;if(!rows.length){box.innerHTML='<div class="empty">Noch keine Anmeldungen vorhanden.</div>';return;}const groups={};rows.forEach(row=>{const key=row.role==='tank'?"Tank":(row.className||row.klasse||"Weitere");(groups[key]??=[]).push(row)});box.innerHTML=Object.entries(groups).map(([name,list])=>`<section class="group"><h3>${esc(name)} (${list.length})</h3>${list.map(row=>`<div class="player"><strong>${esc(row.player||row.char||row.name||'-')}</strong><small>${esc(String(row.note||'').replace(/^Skillung:\s*/i,''))} · ${esc(row.status||'angemeldet')}</small></div>`).join('')}</section>`).join('');}
async function loadRaid(){try{const result=await api("getRaidHelper",{raidId,playerPin:raidId});raid=result.raid||{};document.title=(raid.raidName||"Raid")+" · LichtLoot";document.getElementById("raidTitle").textContent=raid.raidName||"Raidanmelder";document.getElementById("raidDescription").textContent=raid.description||"Meldet euch gerne an.";document.getElementById("raidMeta").innerHTML=`<span>📅 ${esc(formatDate(raid.raidDate))}</span><span>🕒 ${esc(raid.raidTime||'-')} Uhr</span><span>⚑ ${esc(raid.createdBy||'Gildenleitung')}</span>`;renderRoster(result);}catch(error){document.getElementById("roster").innerHTML=`<div class="empty">${esc(error.message)}</div>`;}}
async function loadCharacters(){const feedback=document.getElementById("feedback"),pin=document.getElementById("playerPin").value.trim();feedback.className="status";feedback.textContent="Charaktere werden geladen …";try{const result=await api("getCharactersByPin",{pin});characters=result.characters||[];if(!characters.length)throw new Error("Zu diesem SpielerLogin wurden keine Charaktere gefunden.");document.getElementById("character").innerHTML=characters.map((char,index)=>`<option value="${index}">${esc(char.name||char.char||'')} · ${esc(char.className||char.klasse||'')}</option>`).join('');feedback.className="status good";feedback.textContent="Charaktere geladen.";}catch(error){feedback.className="status bad";feedback.textContent=error.message;}}
async function saveSignup(){const feedback=document.getElementById("feedback"),pin=document.getElementById("playerPin").value.trim(),character=characters[Number(document.getElementById("character").value||0)],spec=document.getElementById("spec").value.trim();if(!pin||!character){feedback.className="status bad";feedback.textContent="Bitte zuerst SpielerLogin und Charakter laden.";return;}feedback.className="status";feedback.textContent="Anmeldung wird gespeichert …";try{await api("saveRaidSignup",{raidId,raid:raid.raid||"other",playerPin:pin,char:character.name||character.char||"",signupStatus:document.getElementById("signupStatus").value,signupRole:roleForSpec(spec),note:spec?"Skillung: "+spec:"",source:"other_raid_page"});feedback.className="status good";feedback.textContent="✓ Anmeldung gespeichert. Der Discord-Anmelder wird aktualisiert.";await loadRaid();}catch(error){feedback.className="status bad";feedback.textContent=error.message;}}
if(!raidId){document.getElementById("roster").innerHTML='<div class="empty">Keine Raid-ID übergeben.</div>';}else loadRaid();
</script>

<footer data-ariee-copyright style="display:block;box-sizing:border-box;clear:both;flex:0 0 auto;width:100%;padding:18px 16px;text-align:center;font:13px/1.5 system-ui,sans-serif;color:inherit;opacity:.8;">© Ariee-Everlook</footer>
</body>
</html>
