<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>LichtLoot Loganalyse</title>
  <style>
    :root{
      --bg:#080d14;--panel:#0d141f;--panel2:#111a27;--line:#263142;--soft:rgba(148,163,184,.12);
      --text:#f1f5f9;--muted:#94a3b8;--gold:#d8ad45;--blue:#60a5fa;--green:#34d399;
      --druid:#ff7c0a;--hunter:#aad372;--mage:#3fc7eb;--paladin:#f48cba;--priest:#f0ebe0;
      --rogue:#fff468;--shaman:#0070dd;--warlock:#8788ee;--warrior:#c69b6d;
    }
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;background:radial-gradient(circle at 78% -15%,rgba(44,62,84,.18),transparent 34%),linear-gradient(180deg,#080d14,#0a1019 60%,#080d14);color:var(--text);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    a{color:inherit}button,input,select{font:inherit}
    .shell{max-width:1680px;margin:0 auto;padding:28px 34px 48px}
    .top{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:20px;align-items:start;margin-bottom:24px}
    .kicker{color:var(--gold);font-size:12px;font-weight:750;letter-spacing:.18em;text-transform:uppercase}
    h1{margin:10px 0 8px;font-size:38px;font-weight:650;line-height:1.08;letter-spacing:-.025em}
    .lead{margin:0;color:var(--muted);font-size:15px;font-weight:450;line-height:1.5}
    .actions,.tabs,.classbar,.filters{display:flex;gap:8px;flex-wrap:wrap}
    .btn,.tab,.class-btn{min-height:40px;border:1px solid var(--line);border-radius:6px;background:rgba(13,20,31,.92);color:var(--text);padding:8px 14px;font-weight:600;text-decoration:none;cursor:pointer}
    .btn.primary,.tab.active,.class-btn.active{border-color:rgba(216,173,69,.7);background:rgba(216,173,69,.10);color:#f1c968}
    .btn.ghost{background:rgba(13,22,36,.48)}
    .filters{padding:14px;border:1px solid var(--line);border-radius:7px;background:rgba(13,20,31,.78);margin-bottom:18px}
    input,select{min-height:42px;border:1px solid var(--line);border-radius:6px;background:#080d14;color:var(--text);padding:0 13px;font-weight:500}
    input{min-width:260px;flex:1}
    .grid{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:14px;align-items:start}
    .panel{border:1px solid var(--line);border-radius:8px;background:rgba(13,22,36,.84);box-shadow:0 18px 44px rgba(0,0,0,.28)}
    .panel-pad{padding:14px}
    .meta{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}
    .badge{display:inline-flex;align-items:center;min-height:25px;border:1px solid var(--line);border-radius:999px;padding:4px 8px;color:var(--muted);font-size:12px;font-weight:950}
    .badge.rpb{border-color:rgba(96,165,250,.42);color:#bfdbfe;background:rgba(96,165,250,.10)}
    .badge.cla{border-color:rgba(250,204,21,.42);color:#fde68a;background:rgba(250,204,21,.10)}
    .section-tools{display:grid;gap:10px;margin-bottom:10px}
    .tab[data-type="cla"]{border-color:rgba(250,204,21,.35)}
    .tab[data-type="rpb"]{border-color:rgba(96,165,250,.35)}
    .tab small{display:block;color:inherit;opacity:.7;font-size:11px;font-weight:950;margin-top:2px}
    .class-btn{min-height:34px;padding:6px 10px}
    .table-wrap{overflow:auto;border:1px solid var(--line);border-radius:8px;background:#060b13;max-height:72vh}
    table{border-collapse:separate;border-spacing:0;width:100%;min-width:920px}
    th,td{border-right:1px solid var(--soft);border-bottom:1px solid var(--soft);padding:7px 9px;white-space:pre-wrap;vertical-align:top;font-size:12px;font-weight:800}
    th{position:sticky;top:0;z-index:3;background:#111827;color:#f8fafc;text-align:left}
    th:first-child,td:first-child{position:sticky;left:0;z-index:2;background:#111827;min-width:220px}
    thead th:first-child{z-index:4}
    .list{display:grid;gap:11px}
    .analysis-row{display:grid;grid-template-columns:82px minmax(230px,1.3fr) minmax(210px,.9fr) minmax(260px,1fr) 80px;min-height:92px;overflow:hidden;border:1px solid var(--line);border-radius:7px;background:linear-gradient(100deg,rgba(17,26,39,.96),rgba(10,16,25,.98));transition:border-color .16s ease,transform .16s ease}
    .analysis-row:hover{border-color:rgba(216,173,69,.48);transform:translateY(-1px)}
    .raid-thumb{position:relative;min-height:92px;overflow:hidden;background:#080d14}
    .raid-thumb img{width:100%;height:100%;object-fit:cover;filter:saturate(.78) contrast(1.04);transition:transform .25s ease}
    .analysis-row:hover .raid-thumb img{transform:scale(1.025)}
    .raid-thumb::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent 62%,rgba(17,26,39,.96))}
    .report-main,.report-progress,.report-stats,.report-open{display:flex;flex-direction:column;justify-content:center;padding:13px 16px}
    .title{font-size:19px;font-weight:650;letter-spacing:-.015em}.sub{color:var(--muted);font-size:12px;font-weight:500;margin-top:8px}
    .roster-dots{display:flex;align-items:center;gap:5px;margin-top:9px;color:#cbd5e1;font-size:11px}.roster-dots i{width:8px;height:8px;border-radius:50%;background:var(--dot);box-shadow:0 0 0 1px rgba(255,255,255,.12)}
    .metric-label{color:#7f8b9c;font-size:10px;font-weight:650;letter-spacing:.08em;text-transform:uppercase}
    .progress-value{margin-top:8px;color:#e2e8f0;font-size:16px}.progress-value strong{color:#e4bb59;font-size:25px;font-weight:500}
    .progress-track{height:3px;margin-top:12px;overflow:hidden;background:#263142}.progress-fill{height:100%;background:#d8ad45}
    .progress-percent{margin-top:7px;color:#94a3b8;font-size:11px}
    .report-stats{display:grid;grid-template-columns:repeat(3,minmax(65px,1fr));gap:18px;border-left:1px solid var(--soft)}
    .report-stat strong{display:block;margin-top:8px;color:#e2e8f0;font-size:17px;font-weight:500}
    .report-open{align-items:flex-end}.details-link{color:#e4bb59;font-size:13px;font-weight:600;text-decoration:none}.details-link:hover{color:#f1d17e}
    .side{display:grid;gap:14px}
    .side h2{margin:0 0 10px;font-size:16px}
    .pills{display:flex;gap:6px;flex-wrap:wrap}
    .pill{display:inline-flex;align-items:center;min-height:25px;border:1px solid var(--line);border-radius:999px;padding:4px 8px;font-size:12px;font-weight:950;background:rgba(6,11,19,.82)}
    .status{padding:16px;border:1px solid var(--line);border-radius:8px;background:rgba(13,22,36,.82);color:var(--muted);font-weight:850}
    .overview{display:grid;grid-template-columns:repeat(5,minmax(120px,1fr));gap:10px;margin-bottom:14px}
    .overview-card{padding:13px;border:1px solid var(--line);border-radius:8px;background:linear-gradient(145deg,rgba(17,29,46,.96),rgba(9,17,29,.96))}
    .overview-card span{display:block;color:var(--muted);font-size:11px;font-weight:950;text-transform:uppercase;letter-spacing:.05em}
    .overview-card strong{display:block;margin-top:5px;font-size:21px;color:var(--text)}
    .detail-nav{display:flex;gap:28px;margin-bottom:14px;border:1px solid var(--line);border-radius:7px;background:rgba(13,20,31,.86);padding:0 18px}
    .detail-nav button{min-height:48px;border:0;border-bottom:2px solid transparent;background:transparent;color:#a8b3c4;padding:0 3px;font-weight:550;cursor:pointer}
    .detail-nav button.active{border-bottom-color:var(--gold);color:#e4bb59}
    .dashboard-grid{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(300px,.85fr);gap:14px}
    .dashboard-column{display:grid;gap:14px;align-content:start}
    .data-card{overflow:hidden;border:1px solid var(--line);border-radius:7px;background:rgba(13,20,31,.9)}
    .data-card h2{margin:0;padding:12px 14px;border-bottom:1px solid var(--soft);font-size:14px;font-weight:650}
    .encounter-row{display:grid;grid-template-columns:28px minmax(150px,1fr) 105px 70px;gap:10px;align-items:center;padding:9px 14px;border-bottom:1px solid var(--soft);font-size:12px}
    .encounter-row:last-child{border-bottom:0}.kill-dot{width:11px;height:11px;border-radius:50%;background:#5fca7b;box-shadow:0 0 0 3px rgba(95,202,123,.1)}.kill-dot.wipe{background:#ef6b73}
    .kill-time{color:#72d58c}.data-table{width:100%;min-width:760px}.data-table th,.data-table td{position:static!important;min-width:0!important;background:transparent;padding:9px 11px;font-weight:500;white-space:nowrap}.data-table th{color:#94a3b8;font-size:10px;font-weight:650;text-transform:uppercase}.player-name{font-weight:650}.role-tag{color:#cbd5e1}.metric-bar{display:inline-block;width:50px;height:4px;margin-left:7px;background:#273244;vertical-align:middle}.metric-bar i{display:block;height:100%;background:#d8ad45}
    .summary-list{display:grid}.summary-item{display:flex;justify-content:space-between;gap:14px;padding:8px 13px;border-bottom:1px solid var(--soft);color:#a8b3c4;font-size:12px}.summary-item:last-child{border-bottom:0}.summary-item strong{color:#e2e8f0;font-weight:550}
    .class-chart{display:grid;grid-template-columns:92px 1fr;gap:16px;align-items:center;padding:16px}.donut{display:grid;width:88px;height:88px;border-radius:50%;background:conic-gradient(#c69b6d 0 22%,#f48cba 22% 36%,#3fc7eb 36% 52%,#aad372 52% 68%,#8788ee 68% 84%,#fff468 84%);place-items:center}.donut::after{content:"";width:55px;height:55px;border-radius:50%;background:#0d141f}.donut-value{position:absolute;font-size:17px;font-weight:650}.class-legend{display:grid;grid-template-columns:1fr 1fr;gap:7px;font-size:11px;color:#b7c0ce}.class-legend span::before{content:"";display:inline-block;width:7px;height:7px;margin-right:6px;border-radius:2px;background:var(--class-color)}
    .notice-list{display:grid;gap:8px;padding:13px;color:#b8c2d0;font-size:12px}.notice{display:flex;gap:8px}.notice-mark{color:#e4bb59}.notice.bad .notice-mark{color:#ef6b73}
    .analysis-data-view{margin-top:14px}
    .error{border-color:rgba(248,113,113,.45);color:#fecdd3;background:rgba(248,113,113,.10)}
    .hidden{display:none}
    @media(max-width:1150px){.analysis-row{grid-template-columns:72px minmax(210px,1fr) minmax(190px,.8fr) 70px}.report-stats{display:none}}
    @media(max-width:900px){.dashboard-grid{grid-template-columns:1fr}.detail-nav{gap:14px;overflow:auto}.detail-nav button{white-space:nowrap}}
    @media(max-width:760px){.shell{padding:20px 14px}.grid,.top{grid-template-columns:1fr}.analysis-row{grid-template-columns:110px minmax(0,1fr) 58px;min-height:108px}.raid-thumb{min-height:108px}.report-progress,.report-stats{display:none}.report-main{padding:14px 10px}.report-open{padding:10px}.table-wrap{max-height:none}.overview{grid-template-columns:repeat(2,minmax(0,1fr))}}
  </style>
</head>
<body>
  <main class="shell">
    <header class="top">
      <div>
        <div class="kicker">LichtLoot</div>
        <h1 id="pageTitle">Loganalyse</h1>
        <p id="pageLead" class="lead">Direkte Auswertung des Warcraft-Logs-Reports in LichtLoot.</p>
        <div id="meta" class="meta"></div>
      </div>
      <div class="actions">
        <a id="analysisBackButton" class="btn ghost hidden" href="raid-analyse.html">← Zur Übersicht</a>
        <a class="btn ghost" href="gildenleitung.html">Gildenleitung</a>
        <button class="btn primary" type="button" onclick="reload()">Neu laden</button>
      </div>
    </header>

    <section class="filters">
      <input id="search" type="search" placeholder="Suchen..." oninput="renderCurrent()">
      <select id="raidFilter" onchange="renderList()"><option value="">Alle Raids</option></select>
      <button class="btn ghost" type="button" onclick="resetFilters()">Filter zurücksetzen</button>
    </section>

    <section id="listView" class="list"></section>

    <section id="detailView" class="hidden">
      <nav id="detailNav" class="detail-nav"></nav>
      <div id="overviewCards" class="overview"></div>
      <div id="dashboardView" class="dashboard-grid">
        <div class="dashboard-column">
          <section class="data-card"><h2>Bossverlauf</h2><div id="encounterList"></div></section>
          <section class="data-card"><h2>Spielerleistung</h2><div class="table-wrap" style="border:0;border-radius:0;max-height:none"><table id="playerPerformanceTable" class="data-table"></table></div></section>
        </div>
        <aside class="dashboard-column">
          <section class="data-card"><h2>Raid-Zusammenfassung</h2><div id="raidSummary"></div></section>
          <section class="data-card"><h2>Klassenverteilung</h2><div id="classDistribution"></div></section>
          <section class="data-card"><h2>Auffälligkeiten</h2><div id="dashboardWarnings" class="notice-list"></div></section>
        </aside>
      </div>
      <div id="analysisDataView" class="analysis-data-view hidden grid">
        <div>
          <div class="panel panel-pad section-tools"><div id="sectionTabs" class="tabs"></div><div id="classTabs" class="classbar"></div></div>
          <div class="table-wrap"><table id="sheetTable"><tbody><tr><td>Auswertung wird geladen...</td></tr></tbody></table></div>
        </div>
        <aside class="side"><section class="panel panel-pad"><h2>Bereich</h2><div id="sectionInfo" class="sub">-</div></section><section class="panel panel-pad"><h2>Klassen</h2><div id="classInfo" class="pills"></div></section><section class="panel panel-pad"><h2>Hinweise</h2><div id="warnings" class="sub">Keine Hinweise.</div></section></aside>
      </div>
    </section>
  </main>

  <script>
    const API_URL = "https://lichtloot-production.up.railway.app/api/apps-script";
    const params = new URLSearchParams(location.search);
    const state = { analyses:[], detail:null, sections:[], activeSection:"", activeClass:"", detailMode:"overview", mode:params.get("id") ? "detail" : "list" };
    const CLASS_ORDER = ["Warrior","Druid","Paladin","Rogue","Hunter","Priest","Mage","Warlock","Shaman","Unknown"];
    const CLASS_LABEL = {Warrior:"Krieger",Druid:"Druiden",Paladin:"Paladine",Rogue:"Schurken",Hunter:"Jäger",Priest:"Priester",Mage:"Magier",Warlock:"Hexenmeister",Shaman:"Schamanen",Unknown:"Unbekannt"};
    const CLASS_COLOR = {Warrior:"var(--warrior)",Druid:"var(--druid)",Paladin:"var(--paladin)",Rogue:"var(--rogue)",Hunter:"var(--hunter)",Priest:"var(--priest)",Mage:"var(--mage)",Warlock:"var(--warlock)",Shaman:"var(--shaman)",Unknown:"#cbd5e1"};
    const RAID_IMAGES={MC:"images/raid-templates/mc.jpg",BWL:"images/raid-templates/bwl.jpg",AQ20:"images/raid-templates/aq20.jpg",AQ40:"images/raid-templates/aq40.jpg",NAXX:"images/raid-templates/naxx.jpg",ONY:"images/raid-templates/ony.jpg",ZG:"images/raid-templates/zg.jpg",Raid:"images/worldbuff-anleitung.jpg"};
    const CLUSTER_CLASSES = {
      healer:["Druid","Paladin","Priest","Shaman"],
      healerCast:["Druid","Paladin","Priest","Shaman"],
      caster:["Druid","Mage","Warlock","Priest","Shaman"],
      casterCast:["Druid","Mage","Warlock","Priest","Shaman"],
      physical:["Warrior","Rogue","Hunter","Druid"],
      physicalCast:["Warrior","Rogue","Hunter","Druid"],
      tank:["Warrior","Druid","Paladin"],
      tankCast:["Warrior","Druid","Paladin"],
      all:CLASS_ORDER
    };

    function html(value){return String(value ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
    function attr(value){return html(value);}
    function key(value){return String(value || "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]+/g," ").trim();}
    function dateDisplay(value){const m=String(value||"").match(/^(\d{4})-(\d{2})-(\d{2})/);return m?`${m[3]}.${m[2]}.${m[1]}`:(value||"-");}
    function raidName(entry){const text=key([entry?.raid,entry?.title,entry?.summary?.raid].join(" "));if(text.includes("blackwing")||text.includes("bwl"))return"BWL";if(text.includes("molten")||text.includes("mc"))return"MC";if(text.includes("aq40")||text.includes("ahn qiraj"))return"AQ40";if(text.includes("naxx"))return"NAXX";if(text.includes("ony"))return"ONY";if(text.includes("zg")||text.includes("zul gurub"))return"ZG";return entry?.raid||"Raid";}
    function raidDisplayName(value){return({MC:"Molten Core",BWL:"Blackwing Lair",AQ20:"Ruins of Ahn'Qiraj",AQ40:"Ahn'Qiraj 40",NAXX:"Naxxramas",ONY:"Onyxia",ZG:"Zul'Gurub"})[value]||value||"Raid";}
    function summaryNumber(summary,keys){for(const name of keys){const value=Number(summary?.[name]);if(Number.isFinite(value)&&value>=0)return value;}return null;}
    function durationDisplay(value){const ms=Number(value||0);if(!ms)return"–";const total=Math.round(ms>10000?ms/1000:ms);const h=Math.floor(total/3600);const m=Math.floor(total%3600/60);const s=total%60;return h?`${h}:${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`:`${m}:${String(s).padStart(2,"0")}`;}
    function shortNumber(value){const number=Number(value||0);if(number>=1000000)return(number/1000000).toFixed(1).replace(".0","")+"m";if(number>=1000)return Math.round(number/1000)+"k";return String(Math.round(number));}
    function roleLabel(player){return player.signupRole||({healer:"Heiler",tank:"Tank",main_tank:"Tank",off_tank:"Tank",caster:"DD",melee:"DD",hunter:"DD",cat:"DD",owl:"DD",shadow:"DD"})[player.raidRole]||"DD";}
    async function api(query){const url=API_URL+"?"+new URLSearchParams({...query,guild:params.get("guild")||"lichtloot",t:Date.now()});const res=await fetch(url,{cache:"no-store"});const data=await res.json().catch(()=>({}));if(!res.ok||data.success===false)throw new Error(data.error||"Daten konnten nicht geladen werden.");return data;}
    function sectionPlayers(section){
      const players=allPlayers();
      const allowed=new Set(Array.isArray(section?.playerFilter)?section.playerFilter:[]);
      return allowed.size?players.filter(player=>allowed.has(player.name)):players;
    }
    function cellText(value){return value&&typeof value==="object"?(value.text||value.name||value.itemName||""):value;}
    function matrixValues(section){
      const stored=section?.matrix?.values || section?.payload?.values;
      if(Array.isArray(stored))return stored;
      if(!Array.isArray(section?.rows))return[];
      const players=sectionPlayers(section);
      return [["Kennzahl",...players.map(player=>player.name)],...section.rows.map(row=>[row.label||"",...players.map(player=>cellText(row.values?.[player.name]??""))])];
    }
    function matrixBackgrounds(section){return section?.matrix?.backgrounds || section?.payload?.backgrounds || [];}
    function matrixFontColors(section){return section?.matrix?.fontColors || section?.payload?.fontColors || [];}
    function clusterFor(label,type){
      if(type==="cla") return "all";
      const t=key(label);
      if(t.includes("heiler")||t.includes("heal")) return t.includes("cast")||t.includes("zauber") ? "healerCast" : "healer";
      if(t.includes("physical")||t.includes("physisch")||t.includes("nahkampf")||t.includes("melee")) return t.includes("cast")||t.includes("zauber") ? "physicalCast" : "physical";
      if(t.includes("caster")||t.includes("zauberer")||t.includes("spell")) return t.includes("cast")||t.includes("zauber") ? "casterCast" : "caster";
      if(t.includes("tank")) return t.includes("cast")||t.includes("zauber") ? "tankCast" : "tank";
      return "all";
    }
    function sectionLabel(section){
      if(section.type==="cla") return section.label || "CLA";
      const cluster = clusterFor(section.label, "rpb");
      const map = {healer:"Heiler",healerCast:"Heiler Cast",caster:"Caster",casterCast:"Caster Cast",physical:"Physical",physicalCast:"Physical Cast",tank:"Tank",tankCast:"Tank Cast",all:"RBP"};
      return map[cluster] || section.label || "RBP";
    }
    function collectSections(detail){
      const out=[];
      (detail?.rpb?.sections||[]).forEach(section=>out.push({...section,type:"rpb",cluster:clusterFor(section.label,"rpb")}));
      (detail?.cla?.sections||[]).forEach(section=>out.push({...section,type:"cla",cluster:"all"}));
      return out;
    }
    function allPlayers(){
      const players=[...(state.detail?.rpb?.players||[]),...(state.detail?.cla?.players||[])];
      const seen=new Map();
      players.forEach(player=>{const name=String(player.name||"").trim();if(name&&!seen.has(name.toLowerCase()))seen.set(name.toLowerCase(),player);});
      return Array.from(seen.values());
    }
    function classesForSection(section){
      const allowed = CLUSTER_CLASSES[section?.cluster || "all"] || CLASS_ORDER;
      const present = new Set(allPlayers().map(p=>p.className||"Unknown"));
      const classes = allowed.filter(cls => present.has(cls));
      return classes.length ? classes : allowed.filter(cls => cls !== "Unknown");
    }
    async function loadList(){
      document.getElementById("listView").innerHTML='<div class="status">Auswertungen werden geladen...</div>';
      const data=await api({action:"getPublicLogAnalyses",limit:60});
      state.analyses=Array.isArray(data.analyses)?data.analyses:[];
      const raids=[...new Set(state.analyses.map(raidName))].sort();
      document.getElementById("raidFilter").innerHTML='<option value="">Alle Raids</option>'+raids.map(r=>`<option>${html(r)}</option>`).join("");
      renderList();
    }
    async function loadDetail(){
      const id=params.get("id")||params.get("analysisId")||"";
      if(!id){state.mode="list";return loadList();}
      document.getElementById("listView").classList.add("hidden");
      document.getElementById("detailView").classList.remove("hidden");
      const backButton=document.getElementById("analysisBackButton");
      if(backButton){backButton.classList.remove("hidden");backButton.href=`raid-analyse.html?guild=${encodeURIComponent(params.get("guild")||"lichtloot")}`;}
      let data;
      try{
        data=await api({action:"getPublicLogAnalysisWeb",id,type:"combined"});
      }catch(error){
        state.mode="list";
        history.replaceState(null,"","raid-analyse.html");
        document.getElementById("detailView").classList.add("hidden");
        document.getElementById("listView").classList.remove("hidden");
        await loadList();
        document.getElementById("listView").insertAdjacentHTML("afterbegin", `<div class="status error">Diese Auswertung konnte nicht direkt aus Warcraft Logs geladen werden.</div>`);
        return;
      }
      state.detail=data.webAnalysis;
      state.sections=collectSections(state.detail);
      state.activeSection=state.sections[0]?.id||"";
      state.activeClass="";
      state.detailMode="overview";
      renderDetail();
    }
    function renderList(){
      state.mode="list";
      document.getElementById("detailView").classList.add("hidden");
      document.getElementById("listView").classList.remove("hidden");
      document.getElementById("analysisBackButton")?.classList.add("hidden");
      document.getElementById("pageTitle").textContent="Loganalysen";
      document.getElementById("meta").innerHTML="";
      const q=key(document.getElementById("search").value);
      const raid=document.getElementById("raidFilter").value;
      const list=state.analyses.filter(a=>(!raid||raidName(a)===raid)&&(!q||key([a.title,a.raid,a.reportCode,raidName(a)].join(" ")).includes(q)));
      document.getElementById("listView").innerHTML=list.length?list.map(a=>{
        const summary=a.summary||{};
        const raidKey=raidName(a);
        const kills=summaryNumber(summary,["bossKills","kills","bossesKilled"]);
        const total=summaryNumber(summary,["totalBosses","bossCount","bosses"]);
        const percent=total&&kills!=null?Math.max(0,Math.min(100,Math.round(kills*100/total))):0;
        const players=summaryNumber(summary,["playerCount","players","raidSize"]);
        const deaths=summaryNumber(summary,["deathCount","deaths","totalDeaths"]);
        const bestPull=summary.bestPull||summary.bestFight||"–";
        const guild=encodeURIComponent(params.get("guild")||"lichtloot");
        return `<article class="analysis-row">
          <div class="raid-thumb"><img src="${attr(RAID_IMAGES[raidKey]||RAID_IMAGES.Raid)}" alt=""></div>
          <div class="report-main"><div class="title">${html(raidDisplayName(raidKey))}</div><div class="sub">▣ ${html(dateDisplay(a.raidDate||summary.raidDate))}${a.reportCode?` &nbsp;·&nbsp; ${html(a.reportCode)}`:""}</div><div class="roster-dots"><i style="--dot:#c69b6d"></i><i style="--dot:#f48cba"></i><i style="--dot:#3fc7eb"></i><i style="--dot:#aad372"></i><i style="--dot:#8788ee"></i><span>${players==null?"Spielerzahl offen":`${players} Spieler`}</span></div></div>
          <div class="report-progress"><span class="metric-label">Bossfortschritt</span><div class="progress-value"><strong>${kills==null?"–":kills}</strong> / ${total==null?"–":total} &nbsp;Bosse</div><div class="progress-track"><div class="progress-fill" style="width:${percent}%"></div></div><div class="progress-percent">${total?percent+" %":"Noch nicht ermittelt"}</div></div>
          <div class="report-stats"><div class="report-stat"><span class="metric-label">Dauer</span><strong>${html(durationDisplay(summary.durationMs||summary.duration))}</strong></div><div class="report-stat"><span class="metric-label">Tode</span><strong>${deaths==null?"–":deaths}</strong></div><div class="report-stat"><span class="metric-label">Bester Pull</span><strong>${html(bestPull)}</strong></div></div>
          <div class="report-open"><a class="details-link" href="raid-analyse.html?id=${encodeURIComponent(a.id)}&guild=${guild}">Details&nbsp; ›</a></div>
        </article>`;
      }).join(""):'<div class="status">Keine Auswertungen gefunden.</div>';
    }
    function renderDetail(){
      const report=state.detail?.report||state.detail?.analysis||{};
      document.getElementById("pageTitle").textContent=report.title||"Raid-Auswertung";
      document.getElementById("meta").innerHTML=[
        `<span class="badge">${html(report.raid||"Raid")}</span>`,
        `<span class="badge">${html(dateDisplay(report.raidDate||report.raid_date))}</span>`,
        state.detail?.rpb?'<span class="badge rpb">Raidleistung</span>':'',
        state.detail?.cla?'<span class="badge cla">Ausrüstung & Vorbereitung</span>':''
      ].filter(Boolean).join("");
      const players=allPlayers();
      const sections=state.sections.length;
      const source=state.detail?.rpb||state.detail?.cla||{};
      const encounters=source.encounters||[];
      const duration=Number(report.durationMs||source.report?.durationMs||0);
      const deaths=players.reduce((sum,player)=>sum+Number(player.deaths||0),0);
      const worldBuffMax=Math.max(1,players.length*9);
      const worldBuffPercent=Math.round(players.reduce((sum,player)=>sum+Number(player.worldBuffCount||0),0)*100/worldBuffMax);
      document.getElementById("overviewCards").innerHTML=[
        ["Bosse",`${encounters.filter(fight=>fight.kill!==false).length} / ${encounters.length||"–"}`],
        ["Dauer",durationDisplay(duration)],
        ["Spieler",players.length],
        ["Tode",deaths],
        ["Worldbuffs",`${worldBuffPercent} %`]
      ].map(([label,value])=>`<div class="overview-card"><span>${html(label)}</span><strong>${html(value)}</strong></div>`).join("");
      renderDetailNav();
      renderDashboard(source,report,players,duration,deaths);
      renderSectionTabs();
      renderClassTabs();
      renderTable();
      renderSide();
    }
    function renderDetailNav(){
      const items=[["overview","Übersicht"],["players","Spieler"],["performance","Leistung"],["preparation","Vorbereitung"],["gear","Ausrüstung"],["deaths","Tode"]];
      document.getElementById("detailNav").innerHTML=items.map(([id,label])=>`<button class="${state.detailMode===id?"active":""}" type="button" onclick="selectDetailMode('${id}')">${label}</button>`).join("");
      const overview=state.detailMode==="overview";
      document.getElementById("dashboardView").classList.toggle("hidden",!overview);
      document.getElementById("overviewCards").classList.toggle("hidden",!overview);
      document.getElementById("analysisDataView").classList.toggle("hidden",overview);
    }
    function selectDetailMode(mode){
      state.detailMode=mode||"overview";
      if(mode!=="overview"){
        const patterns={players:/general|physical|caster|healer|tank/i,performance:/general|casts|zauber/i,preparation:/combat-buffs|world-buffs|general/i,gear:/gear-issues|gear-listing/i,deaths:/general|tank/i};
        const found=state.sections.find(section=>patterns[mode]?.test(`${section.id} ${section.label}`));
        if(found)state.activeSection=found.id;
      }
      renderDetail();
    }
    function renderDashboard(source,report,players,duration,deaths){
      const encounters=source.encounters||[];
      document.getElementById("encounterList").innerHTML=encounters.length?encounters.map((fight,index)=>`<div class="encounter-row"><span class="kill-dot ${fight.kill===false?"wipe":""}"></span><strong>${index+1}. ${html(fight.name||"Boss")}</strong><span class="kill-time">${html(durationDisplay(fight.durationMs))}</span><span>${Number(fight.deaths||0)} Tode</span></div>`).join(""):'<div class="status">Keine Bosskämpfe erkannt.</div>';
      const seconds=Math.max(1,duration/1000);
      const sorted=[...players].sort((a,b)=>Math.max(Number(b.damageDone||0),Number(b.healingDone||0))-Math.max(Number(a.damageDone||0),Number(a.healingDone||0)));
      document.getElementById("playerPerformanceTable").innerHTML=`<thead><tr><th>Spieler</th><th>Klasse</th><th>Anmeldung</th><th>DPS/HPS</th><th>Aktivität</th><th>Tode</th><th>Worldbuffs</th><th>Vorbereitung</th></tr></thead><tbody>${sorted.map(player=>{const healer=roleLabel(player)==="Heiler";const throughput=Math.round(Number(healer?player.healingDone:player.damageDone)/seconds);const activity=Math.round(Number(player.activityPercent||0));const prep=Math.min(100,Math.round(Number(player.preparationCount||0)*100/8));return `<tr><td><span class="player-name" style="color:${CLASS_COLOR[player.className]||"#e2e8f0"}">${html(player.name)}</span></td><td>${html(CLASS_LABEL[player.className]||player.className||"–")}</td><td class="role-tag">${html(roleLabel(player))}</td><td>${shortNumber(throughput)}<span class="metric-bar"><i style="width:${Math.min(100,throughput/10)}%"></i></span></td><td>${activity}%</td><td>${Number(player.deaths||0)}</td><td>${Number(player.worldBuffCount||0)}</td><td>${prep}%</td></tr>`}).join("")}</tbody>`;
      const firstEncounter=encounters[0],lastEncounter=encounters[encounters.length-1];
      document.getElementById("raidSummary").innerHTML=[["Raid",report.raid||"–"],["Datum",dateDisplay(report.raidDate||report.raid_date)],["Erster Boss",firstEncounter?.name||"–"],["Letzter Boss",lastEncounter?.name||"–"],["Dauer",durationDisplay(duration)],["Tode",deaths]].map(([label,value])=>`<div class="summary-item"><span>${html(label)}</span><strong>${html(value)}</strong></div>`).join("");
      const counts={};players.forEach(player=>counts[player.className||"Unknown"]=(counts[player.className||"Unknown"]||0)+1);document.getElementById("classDistribution").innerHTML=`<div class="class-chart"><div style="position:relative"><div class="donut"></div><span class="donut-value" style="inset:34px 0 0;text-align:center">${players.length}</span></div><div class="class-legend">${Object.entries(counts).map(([cls,count])=>`<span style="--class-color:${CLASS_COLOR[cls]||"#94a3b8"}">${html(CLASS_LABEL[cls]||cls)} · ${count}</span>`).join("")}</div></div>`;
      const lowActivity=players.filter(player=>Number(player.activityPercent||0)>0&&Number(player.activityPercent)<80).length;const withoutBuffs=players.filter(player=>Number(player.worldBuffCount||0)===0).length;const repeatedDeaths=players.filter(player=>Number(player.deaths||0)>=2).length;const notices=[[withoutBuffs,`${withoutBuffs} Spieler ohne erkannte Worldbuffs.`],[lowActivity,`${lowActivity} Spieler unter 80 % Aktivität.`],[repeatedDeaths,`${repeatedDeaths} Spieler mindestens zweimal gestorben.`]];document.getElementById("dashboardWarnings").innerHTML=notices.filter(([count])=>count>0).map(([count,text],index)=>`<div class="notice ${index===2?"bad":""}"><span class="notice-mark">${index===2?"▲":"●"}</span><span>${html(text)}</span></div>`).join("")||'<div class="notice"><span class="notice-mark">✓</span><span>Keine Auffälligkeiten erkannt.</span></div>';
    }
    function renderSectionTabs(){
      document.getElementById("sectionTabs").innerHTML=state.sections.map(section=>`
        <button class="tab ${section.id===state.activeSection?'active':''}" data-type="${attr(section.type)}" type="button" onclick="selectSection('${attr(section.id)}')">
          ${html(sectionLabel(section))}<small>${html(section.type.toUpperCase())}${section.label&&sectionLabel(section)!==section.label?" · "+html(section.label):""}</small>
        </button>`).join("") || '<div class="status">Keine Analysedaten vorhanden.</div>';
    }
    function renderClassTabs(){
      const section=activeSection();
      const classes=classesForSection(section);
      document.getElementById("classTabs").innerHTML='<button class="class-btn '+(!state.activeClass?'active':'')+'" type="button" onclick="selectClass(\'\')">Alle</button>'+
        classes.map(cls=>`<button class="class-btn ${state.activeClass===cls?'active':''}" style="color:${CLASS_COLOR[cls]||'#cbd5e1'}" type="button" onclick="selectClass('${attr(cls)}')">${html(CLASS_LABEL[cls]||cls)}</button>`).join("");
    }
    function activeSection(){return state.sections.find(s=>s.id===state.activeSection)||state.sections[0]||null;}
    function rowMatchesClass(row, classes){
      if(!state.activeClass) return true;
      const rowText=key(row.join(" "));
      const classLabel=key(CLASS_LABEL[state.activeClass]||state.activeClass);
      return rowText.includes(key(state.activeClass)) || rowText.includes(classLabel);
    }
    function renderTable(){
      const section=activeSection();
      const table=document.getElementById("sheetTable");
      if(!section){table.innerHTML='<tbody><tr><td>Keine Analysedaten vorhanden.</td></tr></tbody>';return;}
      const values=matrixValues(section);
      const bgs=matrixBackgrounds(section);
      const fcs=matrixFontColors(section);
      const q=key(document.getElementById("search").value);
      const classes=classesForSection(section);
      const rows=values.map((row,rowIndex)=>({row:Array.isArray(row)?row:[],rowIndex}))
        .filter(item=>item.row.some(cell=>String(cell||"").trim()))
        .filter(item=>(!q||key(item.row.join(" ")).includes(q)) && rowMatchesClass(item.row, classes));
      const used=new Set();
      rows.forEach(({row})=>row.forEach((cell,index)=>{if(String(cell||"").trim())used.add(index);}));
      const cols=[...used].sort((a,b)=>a-b);
      const body=rows.map(({row,rowIndex})=>`<tr>${cols.map(col=>{
        const style=[];
        const bg=bgs[rowIndex]?.[col]; const color=fcs[rowIndex]?.[col];
        if(bg) style.push(`background:${String(bg).replace(/"/g,"")}`);
        if(color) style.push(`color:${String(color).replace(/"/g,"")}`);
        return `<td style="${attr(style.join(";"))}">${html(row[col]||"")}</td>`;
      }).join("")}</tr>`).join("");
      table.innerHTML=`<thead><tr>${cols.map((_,i)=>`<th>${i===0?html(section.label||sectionLabel(section)):""}</th>`).join("")}</tr></thead><tbody>${body||'<tr><td>Keine Treffer.</td></tr>'}</tbody>`;
    }
    function renderSide(){
      const section=activeSection();
      const classes=classesForSection(section);
      document.getElementById("sectionInfo").innerHTML=section?`${html(section.type.toUpperCase())} · ${html(section.label||sectionLabel(section))}`:"-";
      document.getElementById("classInfo").innerHTML=classes.map(cls=>`<span class="pill" style="color:${CLASS_COLOR[cls]||'#cbd5e1'}">${html(CLASS_LABEL[cls]||cls)}</span>`).join("")||'<span class="sub">Keine Klassen erkannt.</span>';
      const warnings=[...(state.detail?.rpb?.warnings||[]),...(state.detail?.cla?.warnings||[])];
      document.getElementById("warnings").innerHTML=warnings.length?warnings.map(html).join("<br>"):"Keine Hinweise.";
    }
    function selectSection(id){state.activeSection=id;state.activeClass="";renderDetail();}
    function selectClass(cls){state.activeClass=cls||"";renderClassTabs();renderTable();}
    function resetFilters(){document.getElementById("search").value="";document.getElementById("raidFilter").value="";state.activeClass="";renderCurrent();}
    function renderCurrent(){state.mode==="detail"?renderDetail():renderList();}
    function reload(){state.mode==="detail"?loadDetail().catch(showError):loadList().catch(showError);}
    function showError(error){const box=state.mode==="detail"?document.getElementById("sheetTable"):document.getElementById("listView");if(box.tagName==="TABLE")box.innerHTML=`<tbody><tr><td class="error">${html(error.message||"Fehler")}</td></tr></tbody>`;else box.innerHTML=`<div class="status error">${html(error.message||"Fehler")}</div>`;}
    (async()=>{try{state.mode==="detail"?await loadDetail():await loadList();}catch(error){showError(error);}})();
  </script>
</body>
</html>
