<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Forever · SpielerLogin erstellen | GuildLoot</title><link rel="stylesheet" href="game-switcher.css?v=20260920-guilds"><link rel="stylesheet" href="forever-start.css?v=20260920-logic-v2"><script defer src="game-switcher.js?v=20260920-guilds"></script><script defer src="forever-register.js?v=20260920"></script></head><body>
<header class="portal-header"><a href="index.html"><img src="images/guildloot-logo-concept.webp" alt="GuildLoot" width="210" height="86"></a><span>Dein Gildenbereich</span></header>
<div data-game-switcher="forever"></div>
<main style="max-width:760px"><header class="context"><span>WOW FOREVER</span><h1>SpielerLogin erstellen</h1><p>Dein vollständiger Name erscheint auf den Teilnehmerlisten. Die Gildenleitung gibt neue Zugänge frei.</p></header><div id="notice" role="status" aria-live="polite" hidden></div><section class="panel"><form id="registerForm"><label>Gilde<select name="guild" id="guildSelect" required><option value="">Gilden werden geladen …</option></select></label><div class="entry-grid"><label>Vorname<input name="firstName" required maxlength="29" placeholder="Ariee" autocomplete="off"></label><label>Nachname<input name="lastName" required maxlength="30" placeholder="Mondlichtung" autocomplete="off"></label></div><div class="entry-grid"><label>Klasse<select name="className"><option value="warrior">Krieger</option><option value="paladin">Paladin</option><option value="hunter">Jäger</option><option value="rogue">Schurke</option><option value="priest">Priester</option><option value="shaman">Schamane</option><option value="mage">Magier</option><option value="warlock">Hexenmeister</option><option value="druid">Druide</option></select></label><label>Rolle<select name="role"><option value="dd">Schaden (offen)</option><option value="melee">Nahkampf</option><option value="ranged">Fernkampf</option><option value="heal">Heiler</option><option value="tank">Tank</option></select></label></div><label>Regelwerk<select name="ruleset"><option value="normal">Normal</option><option value="pvp">PvP</option><option value="rp">Rollenspiel</option></select></label><label>Neuer Forever-Login-Code<input name="playerPin" type="password" autocomplete="new-password" required minlength="8" maxlength="32" pattern="[A-Za-z0-9]{8,32}"></label><p class="muted">8–32 Buchstaben und Ziffern. Verwende einen neuen Code für Forever.</p><label>Eigene Sicherheitsfrage<input name="securityQuestion" required minlength="5" maxlength="200" autocomplete="off"></label><label>Antwort<input name="securityAnswer" type="password" required minlength="3" maxlength="200" autocomplete="off"></label><button class="primary" type="submit">Forever-SpielerLogin erstellen</button></form><a id="backLink" class="text-link" href="forever-start.html">← Zum Forever-Login</a></section></main></body></html>
