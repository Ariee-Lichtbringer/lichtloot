<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>LichtLoot Notfall – Plündermeister</title>
<style>
body{margin:0;background:#050b18;color:#eef4ff;font-family:Arial,sans-serif}main{width:min(1000px,94%);margin:30px auto}.card{background:#0c1527;border:1px solid #66551b;border-radius:15px;padding:20px;margin:15px 0}h1,h2{color:#facc15}input,select,button{width:100%;padding:11px;margin:5px 0 12px;border-radius:8px;border:1px solid #42506a;background:#060d1c;color:white;box-sizing:border-box}button{font-weight:900;cursor:pointer}.green{background:#166534}.red{background:#991b1b}.gold{background:#9a6c06}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.status{padding:12px;background:#071022;border-radius:9px}.ok{color:#4ade80}.bad{color:#fb7185}table{width:100%;border-collapse:collapse}th,td{padding:8px;border-bottom:1px solid #334155;text-align:left}@media(max-width:700px){.grid{grid-template-columns:1fr}.table{overflow:auto}}
</style></head><body><main>
<h1>🚨 Notfall-Plündermeister</h1>
<section class="card"><h2>Bestehenden Notfall-Raid öffnen</h2><input id="leadPin" type="password" placeholder="Lead-PIN"><button class="gold" onclick="loadRaid()">Raid laden</button><div id="raidStatus" class="status">Lead-PIN eingeben.</div></section>
<section id="controls" class="card" hidden><h2 id="raidTitle">Raid</h2><div class="grid">
<button class="green" onclick="setStatus('offen',null)">Prio öffnen</button><button class="red" onclick="setStatus('geschlossen',null)">Prio schließen</button>
<button class="green" onclick="setStatus(null,'offen')">P0+ öffnen</button><button class="red" onclick="setStatus(null,'geschlossen')">P0+ schließen</button>
</div><button class="gold" onclick="loadEntries()">Einträge neu laden</button><button onclick="downloadCsv()">Gesamt-CSV herunterladen</button>
<div class="table"><table><thead><tr><th>Spieler</th><th>Klasse</th><th>P1</th><th>P2</th><th>P3</th><th>P0+</th></tr></thead><tbody id="rows"></tbody></table></div></section>
<section class="card"><h2>Neuen Notfall-Raid anlegen</h2><div class="grid"><input id="masterCode" type="password" placeholder="Master-Code"><select id="newRaid"><option>AQ40</option><option>NAXX</option><option>BWL</option><option>MC</option><option>AQ20</option><option>ZG</option><option>ONY</option></select><input id="newDate" type="date"><input id="newRaidId" placeholder="Raid-ID"><input id="newPrioPin" placeholder="Prio-PIN"><input id="newLeadPin" placeholder="Lead-PIN"></div><button class="gold" onclick="createRaid()">Notfall-Raid anlegen</button><div id="createStatus" class="status">Nur nötig, wenn noch keine Notfallkopie angelegt wurde.</div></section>
</main><script>
const API="https://script.google.com/macros/s/AKfycbzwRZ1908IawmEh3WdROu_TBwfu8Yr1YXJ1VicqEIf15eZ2zzRE3Yw9OaaeJ0ZADbye2g/exec";let raid=null,entries=[];
const $=id=>document.getElementById(id),esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function api(params){return new Promise((resolve,reject)=>{const cb="llm_"+Date.now()+"_"+Math.random().toString(36).slice(2),s=document.createElement("script"),timer=setTimeout(()=>{done();reject(new Error("Notfall-API antwortet nicht."))},8000);function done(){clearTimeout(timer);delete window[cb];s.remove()}window[cb]=data=>{done();resolve(data||{})};s.onerror=()=>{done();reject(new Error("Verbindung fehlgeschlagen."))};s.src=API+"?"+new URLSearchParams({...params,callback:cb,t:Date.now()});document.head.appendChild(s)})}
async function loadRaid(){try{const data=await api({action:"getEmergencyRaid",leadPin:$("leadPin").value});if(!data.success)throw new Error(data.error);raid=data.raid;$("controls").hidden=false;renderRaid();await loadEntries()}catch(e){$("raidStatus").innerHTML=`<span class="bad">${esc(e.message)}</span>`}}
function renderRaid(){$("raidTitle").textContent=`${raid.raid} · ${raid.raidDate}`;$("raidStatus").innerHTML=`<span class="ok">Prio: ${esc(raid.prioStatus)} · P0+: ${esc(raid.p0PlusStatus)}</span>`}
async function setStatus(prioStatus,p0PlusStatus){const data=await api({action:"emergencySetRaidStatus",leadPin:$("leadPin").value,prioStatus:prioStatus||raid.prioStatus,p0PlusStatus:p0PlusStatus||raid.p0PlusStatus});if(!data.success)return alert(data.error);raid.prioStatus=data.prioStatus;raid.p0PlusStatus=data.p0PlusStatus;renderRaid()}
async function loadEntries(){const data=await api({action:"getEmergencyPrios",leadPin:$("leadPin").value});if(!data.success)return alert(data.error);entries=data.entries||[];$("rows").innerHTML=entries.map(e=>`<tr><td>${esc(e.player)}</td><td>${esc(e.className)}</td><td>${esc(e.p1)}</td><td>${esc(e.p2)}</td><td>${esc(e.p3)}</td><td>${esc(e.p0Plus)}</td></tr>`).join("")||'<tr><td colspan="6">Noch keine Prios.</td></tr>'}
function cell(v){return '"'+String(v??"").replace(/"/g,'""')+'"'}function downloadCsv(){if(!entries.length)return alert("Noch keine Prios.");const h=["Typ","Raid","Raid-ID","Raiddatum","Charakter","Server","Klasse","Prio 1","Prio 2","Prio 3","PO+","Erstellt am"],rows=[h,...entries.map(e=>["PRIO",e.raid,e.raidId,e.raidDate,e.player,e.server,e.className,e.p1,e.p2,e.p3,e.p0Plus,e.createdAt])],b=new Blob(["\uFEFF"+rows.map(r=>r.map(cell).join(";")).join("\r\n")],{type:"text/csv;charset=utf-8"}),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=`lichtloot-notfall-${raid.raid}-${raid.raidDate}.csv`;a.click()}
async function createRaid(){try{const data=await api({action:"emergencyCreateRaid",masterCode:$("masterCode").value,raid:$("newRaid").value,raidDate:$("newDate").value,raidId:$("newRaidId").value,prioPin:$("newPrioPin").value,leadPin:$("newLeadPin").value});if(!data.success)throw new Error(data.error);$("createStatus").innerHTML=`<span class="ok">✓ Raid ${esc(data.raidId)} wurde angelegt.</span>`;$("leadPin").value=$("newLeadPin").value}catch(e){$("createStatus").innerHTML=`<span class="bad">${esc(e.message)}</span>`}}
$("newDate").value=new Date().toISOString().slice(0,10);
</script></body></html>
